<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<!-- Belépési kapu: szülői munkamenet (közös süti), párosított gyerek tablet (lb-device),
     vagy a párosító oldal (#parositas) engedi tovább; minden más a belépőoldalra kerül.
     A tényleges ellenőrzést a lib/v1/gate.js, illetve gyerek módban a lib/v1/device.js végzi. -->
<style id="lb-gate">html{visibility:hidden}</style>
<script>/* lb-gate */(function(){var d=false;try{d=localStorage.getItem('lb-device')==='1'}catch(e){}if(!d&&location.hash!=='#parositas'&&!/(?:^|;\s*)sb-[a-z0-9]+-auth-token(?:\.0)?=/.test(document.cookie))location.replace('https://laszlobiri.com/belepes/?next='+encodeURIComponent(location.href))})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#293c4b">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gyakorló">
<meta name="description" content="Gyakorló oldal 3. osztályosoknak: matek, nyelvtan és környezetismeret, pontokkal és jelvényekkel.">
<title>Gyakorló</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="preconnect" href="https://laszlobiri.com">
<link rel="stylesheet" href="https://laszlobiri.com/design-system/tokens.css">
<script>
  // Palakék (slate) téma, mint a többi laszlobiri oldalon; ha a legutóbb kiválasztott
  // gyerekprofil rózsaszínt választott, már az első rajzolás is azzal megy (nincs villanás).
  (function () {
    var t = 'slate';
    try {
      var c = JSON.parse(localStorage.getItem('gyakorlo.v2'));
      var p = c && c.pupils && c.pupils.filter(function (x) { return x.id === c.current; })[0];
      if (p && (p.theme === 'rose' || p.theme === 'sky') && location.hash !== '#parositas') t = p.theme;
    } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* A laszlobiri design system alapján (tokens.css a laszlobiri.com-ról). Sötét (palakék) megjelenés;
     gyerekprofilonként választható a rózsaszín (data-theme="rose") és az égkék (data-theme="sky") téma, lent. */
  :root { color-scheme: dark; }
  /* Rózsaszín téma: a gyerekprofil saját palettája (#ebcddb, #e6abc0, #d77ca2, #3c3737, #261d1b).
     Kontraszt: fg 11,2:1 a háttéren; fg-muted 5,3:1 és accent-text 6,1:1 a kártyán; a gombok
     fekete felirata 7,3:1 az accent-en. A jel (mark-*) színei a márkaszabály szerint nem változnak. */
  :root[data-theme="rose"] {
    --bg: #261d1b; --bg-raised: #3c3737; --fg: #ebcddb; --fg-muted: #bfa8b2;
    --accent: #d77ca2; --accent-text: #e6abc0; --line: #5f5558;
  }
  /* Égkék téma (világos): a paletta #1B90DD, #5FCEEA, #FFFFFF; a szöveg és a kiemelt kis szöveg a kék
     sötétített változata. Kontraszt: fg 14,6:1; fg-muted 5,1:1 (háttéren) / 5,6:1 (kártyán); accent-text
     5,7:1 / 6,3:1; a gombok fekete felirata 6,1:1 az accent-en. A jel a design system világos változatát
     használja (fekete L, palakék kitöltő, narancs B), mint a data-theme="light". */
  :root[data-theme="sky"] {
    color-scheme: light;
    --bg: #e7f8fc; --bg-raised: #ffffff; --fg: #082b42; --fg-muted: #526b7b;
    --accent: #1b90dd; --accent-text: #13659b; --line: #9fe2f2;
    --mark-l: #000000; --mark-filler: #293c4b;
  }
  .flag { font-size: 20px; }
  .flag[aria-pressed="true"] { color: var(--accent-text); border-color: var(--accent); }
  .reportbox { margin-top: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
  .reportbox h3 { margin: 0 0 var(--space-2); font-size: 20px; line-height: 26px; font-weight: 600; }
  .reportbox .big-btn { margin: 0; }
  .rep p { margin: var(--space-1) 0 0; }
  .rep .acts { display: flex; flex-direction: column; gap: var(--space-2); flex: none; }
  .themes { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .themes button { min-height: 40px; padding: 0 var(--space-4); border-radius: var(--radius-full); border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 15px; }
  .themes button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-sans); font-size: 17px; line-height: 26px;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 600px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    padding: max(var(--space-4), env(safe-area-inset-top)) var(--space-4) max(var(--space-12), env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  h1, h2, h3, p { margin: 0; }
  .mk .l{fill:var(--mark-l)}.mk .b{fill:var(--mark-b)}

  /* ---------- fejléc ---------- */
  .head { display: flex; align-items: center; gap: var(--space-4); margin: var(--space-4) 0 var(--space-6); }
  .head .mk { width: 52px; height: auto; flex: none; }
  .head h1 { font-size: 34px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: var(--fg-muted); font-size: 15px; line-height: 22px; }

  /* ---------- kártyák ---------- */
  .card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-6); }
  .level { display: flex; flex-direction: column; gap: var(--space-3); }
  .level .row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
  .level .lv { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .level .lv small { font-size: 15px; font-weight: 500; color: var(--accent-text); margin-left: var(--space-2); }
  .level .pts { font-size: 15px; color: var(--fg-muted); }
  .bar { height: 12px; border-radius: var(--radius-full); background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: var(--radius-full); }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-2); }
  .mini div { border-top: 1px solid var(--line); padding-top: var(--space-3); font-size: 14px; line-height: 20px; color: var(--fg-muted); }
  .mini b { display: block; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--fg); }
  .link-btn { background: none; border: 0; padding: 0; text-align: left; color: var(--accent-text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

  .big-btn {
    display: flex; align-items: center; justify-content: center; gap: var(--space-3);
    width: 100%; min-height: 64px; margin-top: var(--space-4);
    background: var(--accent); color: var(--brand-black); border: 0; border-radius: var(--radius-lg);
    font-size: 20px; font-weight: 600; letter-spacing: -0.01em; padding: var(--space-3) var(--space-6);
  }
  .big-btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .big-btn:active { transform: translateY(1px); }

  h2.group { font-size: 14px; line-height: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-muted); margin: var(--space-8) 0 var(--space-3); }
  .topics { display: grid; grid-template-columns: 1fr; gap: var(--space-2); }
  /* téma: elnyújtott téglalap, egymás alatt; balra az ikon, mellette a név és a legjobb eredmény, jobbra nyíl */
  .topic {
    display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: var(--space-4); row-gap: 2px;
    align-items: center; text-align: left; min-height: 72px; padding: var(--space-3) var(--space-4);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
  }
  .topic .ico { grid-row: 1 / 3; }
  .topic .name { grid-column: 2; align-self: end; }
  .topic .best { grid-column: 2; align-self: start; }
  .topic::after { content: '›'; grid-column: 3; grid-row: 1 / 3; font-size: 26px; color: var(--fg-muted); }
  /* összecsukható tantárgyak és témakörök */
  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--space-2); min-height: 44px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '›'; display: inline-block; width: 16px; font-size: 22px; line-height: 1; color: var(--fg-muted); transition: transform .15s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary .cnt { margin-left: auto; font-size: 13px; color: var(--fg-muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 var(--space-2); line-height: 22px; }
  details.subj { margin-top: var(--space-6); }
  details.subj > summary h2.group { margin: 0; }
  details.tk { margin: var(--space-2) 0 0 var(--space-2); }
  details.tk > summary { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--fg); }
  details.tk > .topics { margin: var(--space-2) 0 var(--space-3) calc(-1 * var(--space-2)); }
  .topic:hover { border-color: var(--accent); }
  .ico {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    border: 2px solid var(--accent); color: var(--accent-text);
    font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: -0.02em;
  }
  .ico.sm { font-size: 15px; }
  .ico.emo { font-size: 22px; }
  .topic .name { font-size: 18px; line-height: 22px; font-weight: 600; }
  .topic .best { font-size: 14px; line-height: 20px; color: var(--fg-muted); }

  /* ---------- kvíz ---------- */
  .qbar { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-2) 0 var(--space-4); }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--bg-raised); border: 1px solid var(--line); font-size: 22px; line-height: 1;
  }
  .qtitle { flex: 1; min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .qcount { font-size: 15px; color: var(--fg-muted); font-weight: 500; }
  .chip { display: inline-flex; align-items: center; font-size: 14px; line-height: 20px; font-weight: 500; padding: 2px var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-full); color: var(--fg-muted); }
  .chip.hot { color: var(--accent-text); border-color: currentColor; }

  .dots { display: flex; gap: 8px; justify-content: space-between; margin-bottom: var(--space-6); }
  .dot { flex: 1; max-width: 22px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); }
  .dot.now { border-color: var(--accent); }
  .dot.ok { background: var(--accent); border-color: var(--accent); }
  .dot.bad { border-color: var(--fg-muted); border-style: dashed; }
  .dots.big { justify-content: center; gap: 10px; width: 100%; }
  .dots.big .dot { max-width: 26px; }

  .qcard { padding: var(--space-8) var(--space-6); text-align: center; display: flex; flex-direction: column; gap: var(--space-3); align-items: center; }
  .qprompt { font-size: 16px; line-height: 22px; color: var(--fg-muted); }
  .qtext { font-size: 38px; line-height: 46px; font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .hl { color: var(--accent-text); border-bottom: 3px solid var(--accent); padding: 0 2px; }
  .qtext.svg { font-size: 16px; width: 100%; }
  .qtext.svg svg { width: 100%; height: auto; display: block; }
  .qtext .nlcap { margin-top: var(--space-2); font-size: 18px; line-height: 26px; text-align: center; }
  .qtext.mid { font-size: 30px; line-height: 38px; }
  .qtext.long { font-size: 22px; line-height: 32px; font-weight: 500; letter-spacing: 0; text-align: left; }
  .blank { display: inline-block; min-width: 1.5em; margin: 0 .1em; border-bottom: 4px solid var(--accent); color: var(--accent-text); text-align: center; line-height: 1; }

  .choices { display: grid; gap: var(--space-3); margin-top: var(--space-4); grid-template-columns: 1fr; }
  .choices.grid { grid-template-columns: repeat(2, 1fr); }
  .choices.grid3 { grid-template-columns: repeat(3, 1fr); }
  .choice {
    position: relative; min-height: 68px; padding: var(--space-3) var(--space-4);
    background: var(--bg-raised); border: 2px solid var(--line); border-radius: var(--radius-lg);
    font-size: 20px; line-height: 26px; font-weight: 600; text-align: center;
  }
  .choices.grid3 .choice { font-size: 30px; line-height: 36px; min-height: 76px; padding: var(--space-3) var(--space-2); }
  .choices.grid .choice { font-size: 30px; line-height: 36px; min-height: 76px; }
  .choice:not(:disabled):hover { border-color: var(--accent); }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--accent); border-color: var(--accent); color: var(--brand-black); }
  .choice.wrong { border-style: dashed; border-color: var(--fg-muted); color: var(--fg-muted); text-decoration: line-through; }
  .choice.dim { opacity: .5; }
  .choice .mark { position: absolute; top: 6px; right: 12px; font-size: 18px; line-height: 1; text-decoration: none; }

  .fb { margin-top: var(--space-4); padding: var(--space-4) var(--space-6); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-raised); }
  .fb.good { border-color: var(--accent); }
  .fb h3 { font-size: 22px; line-height: 28px; font-weight: 600; }
  .fb.good h3 { color: var(--accent-text); }
  .fb p { color: var(--fg-muted); margin-top: var(--space-2); font-size: 16px; line-height: 24px; }
  .fb .plus { float: right; font-size: 22px; font-weight: 700; color: var(--accent-text); }

  /* ---------- eredmény ---------- */
  .result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-8) var(--space-6); }
  .result .score { font-size: 72px; line-height: 76px; font-weight: 700; letter-spacing: -0.04em; }
  .result .score small { font-size: 32px; color: var(--fg-muted); letter-spacing: -0.02em; }
  .result h2 { font-size: 24px; line-height: 30px; font-weight: 600; }
  .earn { font-size: 20px; font-weight: 600; color: var(--accent-text); }
  .mgoffer { text-align: center; display: flex; flex-direction: column; gap: var(--space-3); align-items: center; border-color: var(--accent); }
  .mgoffer h3 { margin: 0; font-size: 22px; line-height: 28px; }
  .mgoffer p { margin: 0; color: var(--fg-muted); }
  .mgoffer .row2 { display: flex; gap: var(--space-3); width: 100%; }
  .mgoffer .mgpick { display: flex; flex-direction: column; gap: var(--space-2); width: 100%; }
  .mgoffer .big-btn { margin: 0; }
  .bo { padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); }
  .bo canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: var(--radius-md); background: var(--bg); touch-action: none; }
  .bo .hint { margin: 0; color: var(--fg-muted); text-align: center; font-size: 15px; line-height: 22px; }
  .mgoffer .row2 .big-btn { margin: 0; flex: 1; }
  .hm { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
  .hm svg { width: 150px; height: auto; }
  .hm .hint { color: var(--fg-muted); margin: 0; font-size: 16px; text-align: center; }
  .hm .hmhint { color: var(--fg); }
  .hm .hmhelp { display: flex; justify-content: center; min-height: 0; }
  .hm .hmhelp:empty { display: none; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .slot { min-width: 28px; height: 44px; border-bottom: 4px solid var(--fg-muted); font-size: 30px; line-height: 40px; font-weight: 600; text-align: center; text-transform: uppercase; }
  .slot.lost { color: var(--accent-text); }
  .kb { margin-top: var(--space-4); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .key { width: 42px; height: 48px; padding: 0; border-radius: var(--radius-md); background: var(--bg-raised); border: 2px solid var(--line); color: var(--fg); font: inherit; font-size: 20px; font-weight: 600; text-transform: uppercase; }
  .key:not(:disabled):hover { border-color: var(--accent); }
  .key.hit { background: var(--accent); border-color: var(--accent); color: var(--brand-black); }
  .key.miss { border-style: dashed; border-color: var(--fg-muted); color: var(--fg-muted); text-decoration: line-through; }
  .hm .lives { color: var(--fg-muted); margin: 0; font-size: 15px; }
  .ws { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-4); }
  .wgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: 100%; max-width: 380px; }
  .wc { aspect-ratio: 1; padding: 0; min-width: 0; border-radius: 8px; background: var(--bg); border: 2px solid transparent; color: var(--fg); font: inherit; font-size: 17px; font-weight: 600; text-transform: uppercase; }
  .wc.sel { border-color: var(--accent); color: var(--accent-text); }
  .wc.hit { background: var(--accent); color: var(--brand-black); }
  .wlist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0; padding: 0; list-style: none; }
  .wlist li { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 16px; font-weight: 600; text-transform: uppercase; }
  .wlist li.got { background: var(--accent); border-color: var(--accent); color: var(--brand-black); text-decoration: line-through; }
  .banner { width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--accent); border-radius: var(--radius-md); color: var(--accent-text); font-weight: 600; }
  .newb { width: 100%; display: flex; flex-direction: column; gap: var(--space-2); }
  .newb .it { display: flex; align-items: center; gap: var(--space-3); text-align: left; padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); }
  .newb .ic { font-size: 28px; line-height: 1; flex: none; }
  .newb .tx { font-size: 16px; line-height: 22px; }

  /* ---------- jelvények ---------- */
  .badges { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
  .qbar + h2.group { margin-top: var(--space-4); }
  .badge .bdate { display: block; }
  h2.group .bcount { font-weight: 400; letter-spacing: 0; margin-left: var(--space-2); }
  .badge { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); background: transparent; }
  .badge .bi { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; flex: none; border: 2px dashed var(--line); filter: grayscale(1); opacity: .5; }
  .badge.got { background: var(--bg-raised); }
  .badge.got .bi { border: 2px solid var(--accent); filter: none; opacity: 1; }
  .badge b { display: block; font-size: 18px; line-height: 24px; font-weight: 600; }
  .badge span { color: var(--fg-muted); font-size: 15px; line-height: 22px; }
  .badge:not(.got) b { color: var(--fg-muted); }

  /* ---------- gyerekprofil, szülői nézet, párosítás ---------- */
  .whobar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin: 0 0 var(--space-4); }
  .whobar .me { font-size: 20px; line-height: 28px; }
  .whobar .me b { font-weight: 600; }
  .topic.who .ico { font-size: 40px; }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .card h3 { margin: 0 0 var(--space-2); font-size: 20px; line-height: 26px; font-weight: 600; }
  .card + .card, .card + .big-btn { margin-top: var(--space-4); }
  .inp { width: 100%; min-height: 48px; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 18px; }
  .inp:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .inp.code { text-transform: uppercase; letter-spacing: .15em; text-align: center; font-size: 24px; }
  .avs { display: flex; flex-wrap: wrap; gap: var(--space-2); border: 0; padding: 0; margin: 0; }
  .avs label { cursor: pointer; }
  .avs input { position: absolute; opacity: 0; }
  .avs span { display: grid; place-items: center; width: 52px; height: 52px; font-size: 30px; border-radius: 50%; border: 2px solid var(--line); }

  // 12. Növények (tankönyv 33–35., munkafüzet 37–38. oldal)

      const mkExpr = r => { const plus = Math.random() < 0.5; if (plus) { const a = t10(10, r - 10 >= 10 ? r - 10 : r), b = r - a; if (b >= 10 && a >= 10) return [`${a} + ${b}`, r]; } const b = t10(10, 100); return [`${r + b} − ${b}`, r]; };
      const T = [
        () => { const a = t10(10, 190), b = t10(10, 200 - a), c = a + b; return exprQ('Számold ki!', `${a} + ${b} = ?`, c, `${a}+${b}`, [c + 10, c - 10, c + 20, c - 20, c + 100, Math.abs(a - b)], `${a} + ${b} = ${c}`, { key: `add:${a}:${b}` }); },
        () => { const a = t10(20, 200), b = t10(10, a - 10), c = a - b; return exprQ('Számold ki!', `${a} − ${b} = ?`, c, `${a}-${b}`, [c + 10, c - 10, c + 20, c - 20, a + b > 200 ? c + 30 : a + b, c + 100], `${a} − ${b} = ${c}`, { key: `sub:${a}:${b}` }); },
        () => {
          const a = t10(10, 180), b = t10(10, 200 - a), s = a + b, k = rnd(1, 4);
          const V = [[`${a} + ? = ${s}`, b, `${s}-${a}`], [`? + ${b} = ${s}`, a, `${s}-${b}`], [`${s} − ? = ${a}`, b, `${s}-${a}`], [`? − ${b} = ${a}`, s, `${a}+${b}`]], [text, ans, expr] = V[k - 1];
          return exprQ('Melyik szám hiányzik?', text, ans, expr, [ans + 10, ans - 10, ans + 20, ans - 20, s, a, b], `A hiányzó szám ${ans}.`, { key: 'miss:' + text });
        },
        () => {
          const eq = Math.random() < 0.2, r1 = t10(10, 100), [e1, v1] = mkExpr(r1); let r2 = eq ? r1 : r1 + pick([-30, -20, -10, 10, 20, 30]); if (r2 < 10) r2 = r1 + 10;
          const [e2, v2] = mkExpr(r2); return cmpQ('Hasonlítsd össze az eredményeket!', `${e1} ○ ${e2}`, v1, v2, `${e1} = ${v1}, ${e2} = ${v2}`, { key: `cmpr:${e1}:${e2}`, long: false });
        },
        () => {
          let s, start; do { s = pick([10, 20, 30, 40, 50]); start = t10(10, 80); } while (start + 4 * s > 200);
          const up = Math.random() < 0.7, t = []; for (let i = 0; i < 5; i++) t.push(start + i * s); const seq = up ? t : t.slice().reverse(), h = rnd(1, 4), c = seq[h];
          return numQ(c, [c + s, c - s, c + 10, c - 10, c + 2 * s, c - 2 * s], { prompt: 'Melyik szám hiányzik a sorozatból?', text: seq.map((v, i) => i === h ? '<span class="blank">?</span>' : v).join(', '), key: 'seq:' + seq.join() + h, explain: `A lépés: ${s} (${up ? 'nő' : 'csökken'}). A sor: ${seq.join(', ')}.`, meta: { seq: [seq, h] } });
        },
        () => { const s = pick([20, 30, 40, 50, 90]), x = t10(100, 200 - s - 10), x2 = x + 10; const wrong = [s + 10, s - 10 >= 10 ? s - 10 : s + 20, s + 20].map(v => '+ ' + v); return mc('Melyik művelet szerint változnak a számok?', `${x} → ${x + s}, ${x2} → ${x2 + s}`, '+ ' + s, wrong.concat(['− ' + s]), `${x} + ${s} = ${x + s}, ${x2} + ${s} = ${x2 + s}`, { key: 'rule:' + s + ':' + x, long: false }); },
        () => {
          const [A1, A2] = shuffle(SYM).slice(0, 2), sub = Math.random() < 0.7, sy = pick([A1, A2]);
          const a = sub ? t10(sy[1] + 10, 200) : t10(10, 200 - sy[1]), c = sub ? a - sy[1] : a + sy[1];
          return exprQ('Számold ki! Az azonos jelek azonos számot takarnak.', `${A1[0]} = ${A1[1]}, ${A2[0]} = ${A2[1]}<br>${a} ${sub ? '−' : '+'} ${sy[0]} = ?`, c, `${a}${sub ? '-' : '+'}${sy[1]}`, [c + 10, c - 10, c + 20, c - 20, sub ? a + sy[1] : a - sy[1]], `${sy[0]} = ${sy[1]}, ezért ${a} ${sub ? '−' : '+'} ${sy[1]} = ${c}.`, { key: `sym:${A1[0]}${A2[0]}${a}${sy[0]}${sub}`, long: false });
        }
      ];
      return pickT(T);
    },

    szorosz() {
      const P = []; for (let k = 2; k <= 10; k++) for (let t = 10; t <= 100; t += 10) if (k * t <= 200) P.push([k, t, k * t]);
      const T = [
        () => { const [k, t, p] = pick(P), sw = Math.random() < 0.4; return exprQ('Szorzás', sw ? `${t} · ${k} = ?` : `${k} · ${t} = ?`, p, `${k}*${t}`, [p + 10, p - 10, p + t, p - t, p + k * 10, k + t], `${k} · ${t} = ${p}`, { key: `mul:${k}:${t}:${sw}` }); },
        () => { const [k, t, p] = pick(P.filter(x => x[0] < 10)), byK = Math.random() < 0.5, d = byK ? k : t, q = byK ? t : k; return exprQ('Osztás', `${p} : ${d} = ?`, q, `${p}/${d}`, [q + 1, q - 1, q + 10, q - 10, d, p - d], `${p} : ${d} = ${q}, mert ${d} · ${q} = ${p}.`, { key: `div:${p}:${d}` }); },
        () => {
          const [k, t, p] = pick(P.filter(x => x[0] < 10)), V = [[`${p} : ? = ${t}`, k, `${p}/${t}`], [`${p} : ? = ${k}`, t, `${p}/${k}`], [`? : ${k} = ${t}`, p, `${t}*${k}`], [`${k} · ? = ${p}`, t, `${p}/${k}`], [`? · ${t} = ${p}`, k, `${p}/${t}`]], [text, ans, expr] = pick(V);
          return exprQ('Melyik szám hiányzik?', text, ans, expr, [ans + 1, ans - 1, ans + 10, ans - 10, ans * 2, p, k, t], `A hiányzó szám ${ans}.`, { key: 'smiss:' + text });
        },
        () => {
          const [k, t] = pick(P.filter(x => x[0] >= 2 && x[0] <= 5)), plus = Array(k).fill(t).join(' + '), good = `${k} · ${t}`;
          return mc('Melyik szorzással egyenlő?', plus, good, [`${k + 1} · ${t}`, `${k} · ${t + 10}`, `${k - 1 >= 1 ? k - 1 : k + 2} · ${t}`, `${k} · ${t - 10 >= 10 ? t - 10 : t + 20}`], `${plus} = ${k} · ${t}, mert ${k}-szor ${t} van.`, { key: `rep:${k}:${t}`, long: false, meta: { rep: [k, t] } });
        },
        () => { const [k, t, p] = pick(P.filter(x => x[0] < 10)), kind = rnd(1, 2); return kind === 1 ? exprQ('Melyik osztás igaz?', `${k} · ${t} = ${p}, tehát ${p} : ${k} = ?`, t, String(t), [t + 10, t - 10, k, p - t, t * 2], `${p} : ${k} = ${t}`, { key: `rel1:${k}:${t}` }) : exprQ('Melyik osztás igaz?', `${k} · ${t} = ${p}, tehát ${p} : ${t} = ?`, k, String(k), [k + 1, k - 1, t, k + 10, p - t], `${p} : ${t} = ${k}`, { key: `rel2:${k}:${t}` }); }
      ];
      return pickT(T);
    },

    szoveges() {
      const T = [
        () => { const n = pick(NAMES1), p = t10(30, 90), c = 200 - 2 * p; return exprQ('Szöveges feladat', `${n} 200 Ft-ot kapott. Két egyforma virágot vett, egy virág ${p} Ft. Hány forint a visszajáró?`, c, `200-2*${p}`, [200 - p, 2 * p, c + 10, c - 10, c + 20], `2 · ${p} = ${2 * p}, és 200 − ${2 * p} = ${c}.`, { key: 'sz1:' + p, long: true }); },
        () => { const per = pick([20, 30, 40]), q = rnd(2, Math.min(9, Math.floor(200 / per))), tot = per * q; return exprQ('Szöveges feladat', `Egy gyereknek ${per} virághagymát adtak. Összesen ${tot} hagymát kell elültetni. Hány gyerekre van szükség?`, q, `${tot}/${per}`, [q + 1, q - 1, q + 2, q - 2, per], `${tot} : ${per} = ${q}`, { key: `sz2:${per}:${q}`, long: true }); },
        () => { const a = rnd(20, 70), b = rnd(20, 70), s = a + b + 50; return exprQ('Szöveges feladat', `Csenge gyümölcssalátát készít. ${a} dkg mandarint, ${b} dkg ananászt és fél kg almát vásárolt. Hány dkg gyümölcsöt vásárolt összesen?`, s, `${a}+${b}+50`, [s - 50, s + 50, s + 10, s - 10, s - 100, a + b + 5], `Fél kg = 50 dkg, így ${a} + ${b} + 50 = ${s}.`, { key: `sz3:${a}:${b}`, long: true }); },
        () => { const x = rnd(1, 19) * 5; return exprQ('Szöveges feladat', `A recept ${x} dkg lisztet kér. Hány dkg lisztet kell venni dupla adaghoz?`, 2 * x, `2*${x}`, [x, x + 10, 2 * x + 10, 2 * x - 10, 2 * x + 5], `Dupla adag: 2 · ${x} = ${2 * x}.`, { key: 'sz4:' + x, long: true }); },
        () => { const p = pick([20, 30, 40, 50]), k = rnd(2, Math.min(9, Math.floor(200 / p))), c = p * k; return exprQ('Szöveges feladat', `Egy füzet ${p} Ft. ${k} füzet hány forintba kerül?`, c, `${p}*${k}`, [c + p, c - p, c + 10, c - 10, p + k], `${k} · ${p} = ${c}`, { key: `sz5:${p}:${k}`, long: true }); },
        () => { const n = pick(NAMES1), a = t10(20, 120), b = t10(10, 200 - a), c = a + b; return exprQ('Szöveges feladat', `${n} ${a} Ft-ért ceruzát és ${b} Ft-ért radírt vett. Mennyit fizetett összesen?`, c, `${a}+${b}`, [c + 10, c - 10, a - b > 0 ? a - b : c + 20, c + 20, c - 20], `${a} + ${b} = ${c}`, { key: `sz6:${a}:${b}`, long: true }); },
        () => { const g = pick([20, 30, 40, 50, 60]), q = rnd(2, Math.min(9, Math.floor(200 / g))), tot = g * q; return exprQ('Szöveges feladat', `Egy gyerek ${tot} Ft-ot oszt ${g} Ft-os csoportokra. Hány csoport lesz?`, q, `${tot}/${g}`, [q + 1, q - 1, q + 2, q - 2, g], `${tot} : ${g} = ${q}`, { key: `sz7:${g}:${q}`, long: true }); },
        () => { const x = rnd(10, 19) * 10 + rnd(0, 9), y = rnd(30, x - 20), d = x - y; return exprQ('Szöveges feladat', `Máté ${x} dkg lisztet használt, Réka ${y} dkg lisztet. Hány dkg a különbség?`, d, `${x}-${y}`, [d + 10, d - 10, x + y > 200 ? d + 20 : x + y, d + 1, d - 1], `${x} − ${y} = ${d}`, { key: `sz8:${x}:${y}`, long: true }); },
        () => { const k = rnd(2, 6), t = t10(10, Math.floor(200 / k / 10) * 10), c = k * t; return exprQ('Szöveges feladat', `Egy dobozban ${t} ceruza van. ${k} dobozban hány ceruza van összesen?`, c, `${k}*${t}`, [c + t, c - t, c + 10, c - 10, k + t], `${k} · ${t} = ${c}`, { key: `sz9:${k}:${t}`, long: true }); },
        () => { const k = rnd(2, 8), t = t10(10, Math.floor(200 / k / 10) * 10), p = k * t; return exprQ('Szöveges feladat', `${p} Ft-ot egyenlően elosztanak ${k} gyerek között. Hány forint jut egy gyereknek?`, t, `${p}/${k}`, [t + 10, t - 10 >= 10 ? t - 10 : t + 20, k, p - k, t + 20], `${p} : ${k} = ${t}`, { key: `sz10:${k}:${t}`, long: true }); }
      ];
      return pickT(T);
    },

    meres() {
      const T = [
        () => {
          const K = [
            () => { const k = rnd(1, 2); return [`${k} kg = ? dkg`, k * 100, `${k} kg = ${k * 100} dkg`, `${k}*100`]; },
            () => [`fél kg = ? dkg`, 50, 'Fél kg = 50 dkg', '50'],
            () => { const d = rnd(1, 99); return [`1 kg ${d} dkg = ? dkg`, 100 + d, `1 kg = 100 dkg, így 1 kg ${d} dkg = ${100 + d} dkg.`, `100+${d}`]; },
            () => { const k = rnd(1, 2); return [`${k} m = ? cm`, k * 100, `${k} m = ${k * 100} cm`, `${k}*100`]; },
            () => { const c = rnd(1, 99); return [`1 m ${c} cm = ? cm`, 100 + c, `1 m = 100 cm, így 1 m ${c} cm = ${100 + c} cm.`, `100+${c}`]; },
            () => { const k = rnd(1, 2); return [`${k * 100} dkg = ? kg`, k, `${k * 100} dkg = ${k} kg`, String(k)]; },
            () => { const k = rnd(1, 2); return [`${k * 100} cm = ? m`, k, `${k * 100} cm = ${k} m`, String(k)]; }
          ], [text, ans, ex, expr] = pick(K)();
          return exprQ('Váltsd át!', text, ans, expr, [ans * 10, ans % 10 === 0 ? ans / 10 : ans + 10, ans + 10, ans - 10, ans + 1, ans - 1, ans + 50].filter(v => v > 0), ex, { key: 'conv:' + text });
        },
        () => {
          const n = rnd(101, 199), d = n - 100, unit = pick([['kg', 'dkg'], ['m', 'cm']]), good = `1 ${unit[0]} ${d} ${unit[1]}`;
          const pool = [`1 ${unit[0]} ${d + 10 <= 99 ? d + 10 : d - 10 >= 1 ? d - 10 : d + 1} ${unit[1]}`, `2 ${unit[0]} ${d} ${unit[1]}`, `1 ${unit[0]} ${d % 10 * 10 + Math.floor(d / 10)} ${unit[1]}`, `11 ${unit[0]} ${d} ${unit[1]}`, `1 ${unit[0]} ${d + 1 <= 99 ? d + 1 : d - 1} ${unit[1]}`];
          return mc('Váltsd át!', `${n} ${unit[1]} = ?`, good, pool, `${n} ${unit[1]} = 100 ${unit[1]} + ${d} ${unit[1]} = ${good}`, { key: `conv2:${n}:${unit[0]}`, meta: { conv2: [n, good] } });
        },
        () => {
          const [big, small] = pick([['kg', 'dkg'], ['m', 'cm']]), k = rnd(1, 2), eq = Math.random() < 0.2, d = eq ? k * 100 : rnd(30, 199), left = Math.random() < 0.5;
          const bt = `${k} ${big}`, st = `${d} ${small}`; const l = left ? k * 100 : d, r = left ? d : k * 100;
          return cmpQ('Hasonlítsd össze a mennyiségeket!', left ? `${bt} ○ ${st}` : `${st} ○ ${bt}`, l, r, `1 ${big} = 100 ${small}, így ${k} ${big} = ${k * 100} ${small}.`, { key: `cmpm:${bt}:${st}:${left}`, long: false });
        },
        () => {
          const lo = rnd(30, 190), hi = lo + rnd(3, 12), c = rnd(lo + 1, hi - 1), big = hi === 100;
          return numQ(c, [lo, hi, lo - 1, hi + 1, lo - 2, hi + 2, lo - 3, hi + 3], { prompt: 'Melyik szám lehet a ? helyén (dkg)?', text: big ? `${100} dkg > ? > ${lo} dkg`.replace('100 dkg', '1 kg') : `${lo} dkg < ? < ${hi} dkg`, long: false, key: `mbtw:${lo}:${hi}:${c}`, explain: `${lo} < ${c} < ${hi}`, meta: { between: [lo, hi] } });
        },
        () => {
          const x = t10(10, 100), y = t10(10, 100), s = x + y, z = t10(10, s - 10), c = s - z;
          return exprQ('Hány dkg kell a jobb serpenyőbe, hogy a mérleg egyensúlyban legyen?', `Bal: ${x} dkg + ${y} dkg<br>Jobb: ${z} dkg + ? dkg`, c, `${x}+${y}-${z}`, [c + 10, c - 10, s, z, c + 20, c - 20], `Bal: ${x} + ${y} = ${s} dkg. ${s} − ${z} = ${c}.`, { key: `bal:${x}:${y}:${z}`, long: false });
        }
      ];
      return pickT(T);
    },

    penz() {
      const T = [
        () => { const c = randCoins(), s = c.reduce((a, b) => a + b, 0); return exprQ('Mennyi pénz van a tárcában?', c.slice().sort((a, b) => b - a).map(v => v + ' Ft').join(', '), s, c.join('+'), [s + 10, s - 10, s + 20, s - 20, s + 30, s - 30, s + 50, s - 50], `${c.join(' + ')} = ${s} Ft`, { key: 'wal:' + c.slice().sort().join(), long: false }); },
        () => {
          const c = randCoins(), s = c.reduce((a, b) => a + b, 0), good = coinsLabel(c), bad = new Set();
          for (let i = 0; i < 80 && bad.size < 3; i++) { const o = randCoins(); const so = o.reduce((a, b) => a + b, 0); if (so !== s) bad.add(coinsLabel(o)); }
          return mc('Melyik érmékkel fizethető ki pontosan?', `${s} Ft`, good, Array.from(bad), `${good} = ${s}`, { key: 'pay:' + s + ':' + good, meta: { coins: [s, good] } });
        },
        () => { const p = t10(20, 190), c = 200 - p; return exprQ('Mennyi a visszajáró?', `Fizetsz 200 Ft-tal. A vásárlás ${p} Ft.`, c, `200-${p}`, [c + 10, c - 10, c + 20, c - 20, p], `200 − ${p} = ${c}`, { key: 'chg:' + p, long: false }); }
      ];
      return pickT(T);
    }
  });

  /* ================= Matek: a tankönyv és a munkafüzet fejezetei =================
     A feladattípusok és a megfogalmazás a két könyvből valók; a számok a fejezet számkörén belül
     véletlenek (a szülő jóváhagyásával). A ragozott számokhoz (pl. „37-tel”, „16-ot”) a SUF tábla kell. */
  const NW1 = ['', 'egy', 'kettő', 'három', 'négy', 'öt', 'hat', 'hét', 'nyolc', 'kilenc'];
  const NW10 = ['', 'tizen', 'huszon', 'harminc', 'negyven', 'ötven', 'hatvan', 'hetven', 'nyolcvan', 'kilencven'];
  const NW100 = ['', 'száz', 'kétszáz', 'háromszáz', 'négyszáz', 'ötszáz', 'hatszáz', 'hétszáz', 'nyolcszáz', 'kilencszáz'];
  function nw(n) {   // 0–1000, betűvel
    if (n === 0) return 'nulla'; if (n === 1000) return 'ezer';
    const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), u = n % 10;
    let s = NW100[h];
    if (t === 1 && u === 0) s += 'tíz'; else if (t === 2 && u === 0) s += 'húsz'; else s += NW10[t] + NW1[u];
    return s;
  }
  // ragok a szám utolsó kiejtett része szerint: [-val/-vel, tárgyrag, -hoz/-hez/-höz, -nál/-nél]
  const SUF = { 1: ['gyel', 'et', 'hez', 'nél'], 2: ['vel', 't', 'höz', 'nél'], 3: ['mal', 'at', 'hoz', 'nál'], 4: ['gyel', 'et', 'hez', 'nél'], 5: ['tel', 'öt', 'höz', 'nél'],
    6: ['tal', 'ot', 'hoz', 'nál'], 7: ['tel', 'et', 'hez', 'nél'], 8: ['cal', 'at', 'hoz', 'nál'], 9: ['cel', 'et', 'hez', 'nél'], 10: ['zel', 'et', 'hez', 'nél'],
    20: ['szal', 'at', 'hoz', 'nál'], 30: ['cal', 'at', 'hoz', 'nál'], 40: ['nel', 'et', 'hez', 'nél'], 50: ['nel', 'et', 'hez', 'nél'], 60: ['nal', 'at', 'hoz', 'nál'],
    70: ['nel', 'et', 'hez', 'nél'], 80: ['nal', 'at', 'hoz', 'nál'], 90: ['nel', 'et', 'hez', 'nél'], 100: ['zal', 'at', 'hoz', 'nál'], 1000: ['rel', 'et', 'hez', 'nél'] };
  const sufOf = n => SUF[n % 10 ? n % 10 : n % 100 ? n % 100 : n === 1000 ? 1000 : 100];
  const Nvel = n => `${n}-${sufOf(n)[0]}`, Nt = n => `${n}-${sufOf(n)[1]}`, Nhoz = n => `${n}-${sufOf(n)[2]}`, Nnal = n => `${n}-${sufOf(n)[3]}`;
  const az = n => /^[aáeéiíoóöőuúüű]/.test(nw(n)) ? 'az' : 'a', Az = n => cap(az(n));
  const SZORO = [null, 'egyszerese', 'kétszerese', 'háromszorosa', 'négyszerese', 'ötszöröse', 'hatszorosa', 'hétszerese', 'nyolcszorosa', 'kilencszerese', 'tízszerese'];
  const RESZ = [null, null, 'fele', 'harmada', 'negyede', 'ötöde', 'hatoda', 'hetede', 'nyolcada', 'kilencede', 'tizede'];
  const RESZ_HOZ = [null, null, 'feléhez', 'harmadához', 'negyedéhez', 'ötödéhez'], RESZ_T = [null, null, 'felét', 'harmadát', 'negyedét', 'ötödét'];
  const SZORO_BOL = [null, null, 'kétszereséből', 'háromszorosából', 'négyszereséből', 'ötszöröséből', 'hatszorosából', 'hétszereséből', 'nyolcszorosából', 'kilencszereséből'];
  const SZORO_HOZ = [null, null, 'kétszereséhez', 'háromszorosához', 'négyszereséhez', 'ötszöröséhez', 'hatszorosához', 'hétszereséhez', 'nyolcszorosához', 'kilencszereséhez'];
  const SZORO_T = [null, null, 'kétszeresét', 'háromszorosát', 'négyszeresét', 'ötszörösét', 'hatszorosát', 'hétszeresét', 'nyolcszorosát', 'kilencszeresét'];
  const ANNYI = [null, 'egyszer', 'kétszer', 'háromszor', 'négyszer', 'ötször', 'hatszor', 'hétszer', 'nyolcszor', 'kilencszer', 'tízszer'];
  const FOEN = [null, null, 'ketten', 'hárman', 'négyen', 'öten', 'hatan', 'heten', 'nyolcan', 'kilencen', 'tízen'];
  const CSOP = [null, null, 'kettes', 'hármas', 'négyes', 'ötös', 'hatos', 'hetes', 'nyolcas', 'kilences', 'tízes'];
  const NEVEK = ['Emese', 'Réka', 'Éva', 'Máté', 'Karcsi', 'Vera', 'Lilla', 'Bori', 'Áron', 'Luca', 'Laci', 'Pali', 'Adri', 'Erika', 'Anita', 'Peti'];
  const mq = (prompt, text, ans, cands, explain, key, extra) => numQ(ans, cands, Object.assign({ prompt, text, explain, key, long: strip(String(text)).length > 36 }, extra));
  // hangrend szerinti ragok (a -nál/-nél alapján): -tól/-től, -ból/-ből, -an/-en

  /* Tanmenet: tantárgyanként a könyv témakörei és fejezetei (a tartalomjegyzék szerint).

  const CURRICULUM = [

      ['Számolás 0-tól 200-ig', [['m2-1', 'Számok 200-ig', '28–31', ['m201']], ['m2-2', 'Számok helye a számegyenesen', '32', ['m202']], ['m2-3', 'Számszomszédok, kerekítés', '33–34', ['m203']],
        ['m2-4', 'Összeadás és kivonás', '35–37', ['m204']], ['m2-5', 'Szorzás és osztás', '38–43', ['m205']]]],
      ['Mérések', [['m3-1', 'Mit mivel mérünk?', '44', ['m301']], ['m3-2', 'A tömeg mérése', '45–46', ['m302']], ['m3-3', 'Az űrtartalom mérése', '47–51', ['m303']]]],

      ['Írásbeli kivonás', [['m7-1', 'Háromjegyű számok kivonása', '86–87'], ['m7-2', 'A különbség becslése', '88'], ['m7-3', 'Írásbeli kivonás', '89–93'],

      ['Számolás 0-tól 1000-ig', [['m9-1', 'Számok 1000-ig', '108–109'], ['m9-2', 'Helyi érték', '110–111'], ['m9-3', 'Összeadás és kivonás', '112–113'],
        ['m9-4', 'Szorzás és osztás', '114–117']]],
      ['Írásbeli műveletek 1000-ig', [['m10-1', 'Írásbeli összeadás és kivonás', '118–121'], ['m10-2', 'Írásbeli szorzás egyjegyű szorzóval', '122–128'],
        ['m10-3', 'Összefüggések, következtetések', '129'], ['m10-4', 'A műveletek sorrendje', '130–133']]],
      ['Törtek', [['m11-1', 'Ismerkedés a törtekkel', '134–137']]],
      ['Mérések II.', [['m12-1', 'Az idő mérése', '138–141'], ['m12-2', 'A hosszúság mérése', '142–145'], ['m12-3', 'A kerület mérése', '146–147'], ['m12-4', 'A terület mérése', '148–149']]],
      ['Év végi ismétlés', [['m13-1', 'Év végi ismétlés', '150–159']]]] },
    { id: 'kornyezet', name: 'Környezetismeret', groups: [
      ['II. Élő környezetünk', [['k11', '11. Az élőlények tulajdonságai', '30–32', ['elo']], ['k12', '12. Növények', '33–35', ['novenyek']], ['k13', '13. Állatok', '36–38', ['allatok']],
        ['k14', '14. Emlősállatok', '39–40', ['emlosok']], ['k15', '15. Madarak', '41–43', ['madarak']], ['k16', '16. Halak', '44–45', ['halak']],
        ['k17', '17. Kétéltűek és hüllők', '46–47', ['keteltu']], ['k18', '18. Rovarok', '48–49', ['rovarok']]]]] }
  ];
  const CH_OF = {};   // téma → { subj, ch }
  CURRICULUM.forEach(S0 => S0.groups.forEach(([, chs]) => chs.forEach(([ch, , , ts]) => (ts || []).forEach(t => { CH_OF[t] = { subj: S0.id, ch }; }))));
  const topicOpen = id => { const m = CH_OF[id]; if (!m) return true; const L = C.access && C.access[m.subj]; return !Array.isArray(L) || L.includes(m.ch); };
  const openTopics = () => { const o = TOPICS.filter(t => topicOpen(t.id)); return o.length ? o : TOPICS; };

  // Egy feladattípus (sablon) kiválasztása; a feladat megjegyzi, melyikből készült (buildRound).
  function pickT(T) { const i = rnd(0, T.length - 1), q = T[i](); q.tpl = i; q.tplN = T.length; return q; }
  function makeQuestion(topic) {
    const id = topic === 'vegyes' ? pick(openTopics()).id : topic;
    const q = GEN[id](); q.topic = id; return q;
  }
  // A kör összeállítása, változatosan: minden feladat megjegyzi, melyik sablonból (feladattípusból)
  // készült (pickT). Egy körben egy típus legfeljebb kétszer szerepel (ha a témának kevés típusa
  // van, arányosan többször), és két azonos típusú feladat nem jön egymás után. A vegyes körben
  // ugyanez témánként: egy témából legfeljebb kettő, és nem egymás után.
  function buildRound(topic) {
    const mixed = topic === 'vegyes';
    const tplOf = mixed ? q => q.topic : q => q.topic + ':' + (q.tpl ?? '-');
    const qs = [], seen = {}, cnt = {};
    for (let tries = 0; qs.length < 10 && tries < 800; tries++) {
      const q = makeQuestion(topic), k = q.topic + (q.key || q.text), t = tplOf(q);
      const cap = mixed ? 2 : Math.max(2, Math.ceil(10 / (q.tplN || 1)));
      if (seen[k] || (cnt[t] || 0) >= cap) continue;
      seen[k] = 1; cnt[t] = (cnt[t] || 0) + 1; qs.push(q);
    }
    while (qs.length < 10) qs.push(makeQuestion(topic));
    // Sorrend: mindig a legtöbbször maradt típusból jön a következő, ami nem egyezik az előzővel.
    const out = [], rest = shuffle(qs);
    while (rest.length) {
      const last = out.length ? tplOf(out[out.length - 1]) : null, left = {};
      rest.forEach(q => { left[tplOf(q)] = (left[tplOf(q)] || 0) + 1; });
      const order = Object.keys(left).filter(t => t !== last).sort((a, b) => left[b] - left[a]);
      const want = order.length ? order[0] : last;
      out.push(rest.splice(rest.findIndex(q => tplOf(q) === want), 1)[0]);
    }
    return out;
  }

  /* ================= mentés: a háztartás közös adatai ================= */
  // Döntés: a régi, belépés nélküli pontok nem kerülnek át; az új verzió törli őket.
  try { localStorage.removeItem('gyakorlo.v1'); } catch (e) {}
  const def = () => ({ points: 0, answered: 0, correct: 0, rounds: 0, perfect: 0, best: {}, played: {}, badges: {}, days: 0, lastDay: '', mgDone: 0, mgWins: 0, mgN: 0, wsWins: 0, boWins: 0 });
  const CACHE_KEY = 'gyakorlo.v2';
  const FOLD_KEY = 'gyakorlo.fold.v1';
  let FOLD = {}; try { FOLD = JSON.parse(localStorage.getItem(FOLD_KEY)) || {}; } catch (e) { FOLD = {}; }
  const foldOpen = (k, def) => (k in FOLD ? FOLD[k] : def);
  // Minijáték jutalom ennyi pontonként (egy hibátlan kör 150 pont).
  const MG_EVERY = 500;
  const outbox = createOutbox('gyakorlo.outbox.v1');
  // Gyerekprofilonként választható színtéma (pupils.theme).
  const THEMES = {
    slate: { name: 'Palakék', bg: '#293c4b', dot: '#ee8643' },
    rose: { name: 'Rózsaszín', bg: '#261d1b', dot: '#d77ca2' },
    sky: { name: 'Égkék', bg: '#e7f8fc', dot: '#1b90dd' },
  };
  const AVATARS = { fox: '🦊', owl: '🦉', cat: '🐱', bear: '🐻', frog: '🐸', bee: '🐝', rabbit: '🐰', turtle: '🐢' };
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const esc = v => String(v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  // 'parent': szülő; 'device': gyerek tablet; 'pair': párosító oldal (#parositas).
  let MODE = isDevice() ? 'device' : location.hash === '#parositas' ? 'pair' : 'parent';
  let sb = null;
  let C = loadCache();
  let S = def();
  let msg = '';                 // üzenet a szülői / párosító nézetben
  let devices = null;           // a szülői nézet eszközlistája

  const APP_VERSION = 'gyakorlo-v27';
  const REASONS = { wrong_answer: 'Rossz a megoldás', bad_question: 'Hibás a kérdés', other: 'Más baj van' };

  function emptyCache() { return { pupils: [], results: {}, badges: {}, current: null, userId: null, householdId: null, access: {} }; }
  function loadCache() {
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c && Array.isArray(c.pupils)) return Object.assign(emptyCache(), c); } catch (e) {}
    return emptyCache();
  }
  function saveCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(C)); } catch (e) { /* nincs tárhely */ } }
  const pupil = () => C.pupils.find(p => p.id === C.current) || null;

  // A gyerek állapota (pont, szint, sorozat, legjobbak, jelvények) az eredményekből számolódik.
  function computeState(pid) {
    const s = def(), days = [];
    const rs = (C.results[pid] || []).slice().sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
    for (const r of rs) {
      s.points += r.points | 0;
      if (r.kind === 'round') {
        s.answered += r.answered | 0; s.correct += r.correct | 0; s.rounds++;
        if (r.score === 10) s.perfect++;
        s.best[r.topic] = Math.max(s.best[r.topic] || 0, r.score | 0);
        if (r.topic !== 'vegyes') s.played[r.topic] = 1;
        const d = dayStr(new Date(r.created_at));
        if (days[days.length - 1] !== d) days.push(d);
      } else if (r.kind === 'hangman') s.mgWins++;
      else if (r.kind === 'wordsearch') s.wsWins++;
      else if (r.kind === 'breakout') s.boWins++;
    }
    // Napi sorozat: az utolsó gyakorlási napig egymást követő napok száma.
    let run = days.length ? 1 : 0;
    for (let i = days.length - 2; i >= 0; i--) {
      const prev = new Date(days[i + 1] + 'T12:00:00'); prev.setDate(prev.getDate() - 1);
      if (dayStr(prev) === days[i]) run++; else break;
    }
    s.days = run; s.lastDay = days[days.length - 1] || '';
    s.mgDone = Math.floor(s.points / MG_EVERY); s.mgN = s.mgDone;
    Object.assign(s.badges, C.badges[pid] || {});
    return s;
  }
  const refreshS = () => { S = C.current ? computeState(C.current) : def(); };

  // Egy befejezett kör vagy minijáték mentése (azonnal helyben, a sorban a szerver felé).
  function record(kind, f) {
    const p = pupil(); if (!p) return;
    const row = { id: crypto.randomUUID(), pupil_id: p.id, kind, topic: f.topic ?? null, score: f.score ?? 0, best_streak: f.best_streak ?? 0,
      answered: f.answered ?? 0, correct: f.correct ?? 0, points: f.points ?? 0, created_at: new Date().toISOString() };
    (C.results[p.id] ||= []).push(row);
    outbox.enqueue({ t: 'result', row });
    const have = (C.badges[p.id] ||= {});
    for (const [id, day] of Object.entries(S.badges)) {
      if (have[id]) continue;
      have[id] = day;
      outbox.enqueue({ t: 'badge', row: { pupil_id: p.id, badge_id: id, earned_at: new Date().toISOString() } });
    }
    saveCache(); kick();
  }

  async function handle(op) {
    if (op.t === 'report') {
      const { error } = await sb.from('question_reports').insert(op.row);
      if (error && error.code !== '23505') throw error;
      return;
    }
    if (op.t === 'theme') {
      const { error } = await sb.from('pupils').update({ theme: op.theme }).eq('id', op.id);
      if (error) throw error;
      return;
    }
    const { error } = await sb.from(op.t === 'result' ? 'results' : 'pupil_badges').insert(op.row);
    if (error && error.code !== '23505') throw error;   // 23505: már fent van (ismételt küldés)
  }

  async function pull() {
    const pr = await sb.from('pupils').select('id, nickname, avatar, theme').order('created_at');
    if (pr.error) throw pr.error;
    C.pupils = pr.data.filter(p => UUID.test(p.id)).map(p => ({ id: p.id, nickname: String(p.nickname), avatar: AVATARS[p.avatar] ? p.avatar : 'fox', theme: THEMES[p.theme] ? p.theme : 'slate' }));
    const ids = C.pupils.map(p => p.id);
    C.results = {}; C.badges = {};
    if (ids.length) {
      const [r, b] = await Promise.all([
        sb.from('results').select('id, pupil_id, kind, topic, score, best_streak, answered, correct, points, created_at').in('pupil_id', ids).order('created_at'),
        sb.from('pupil_badges').select('pupil_id, badge_id, earned_at').in('pupil_id', ids),
      ]);
      if (r.error) throw r.error;
      if (b.error) throw b.error;
      for (const x of r.data) (C.results[x.pupil_id] ||= []).push(x);
      for (const x of b.data) (C.badges[x.pupil_id] ||= {})[x.badge_id] = dayStr(new Date(x.earned_at));
    }
    // A még el nem küldött eredmények és jelvények.
    for (const op of outbox.pending()) {
      if (op.t === 'result' && C.results[op.row.pupil_id] && !C.results[op.row.pupil_id].some(x => x.id === op.row.id)) C.results[op.row.pupil_id].push(op.row);
      if (op.t === 'badge' && C.badges[op.row.pupil_id]) C.badges[op.row.pupil_id][op.row.badge_id] ??= dayStr(new Date(op.row.earned_at));
      if (op.t === 'theme') { const x = C.pupils.find(q => q.id === op.id); if (x) x.theme = op.theme; }
    }
    // Elérhető fejezetek (a szülő beállítása; tantárgy → fejezetkódok). Hibánál a régi marad.
    const ac = await sb.from('chapter_access').select('subject, chapters');
    if (!ac.error) { C.access = {}; for (const x of ac.data) if (Array.isArray(x.chapters)) C.access[x.subject] = x.chapters.map(String); }
    if (MODE === 'parent' && !C.householdId) {
      const h = await sb.from('households').select('id').limit(1).maybeSingle();
      if (!h.error && h.data) C.householdId = h.data.id;
    }
    if (C.current && !ids.includes(C.current)) C.current = null;
    if (MODE === 'device' && ids.length === 1) C.current = ids[0];
    saveCache();
    // Játék közben és a szülői / párosító űrlapokon nem rajzolunk újra.
    if (['home', 'who', 'badges'].includes(view)) {
      refreshS();
      if (view === 'home' && !C.current) view = 'who';
      // Gyerek tablet egy hozzárendelt gyerekkel: rögtön az ő kezdőképernyője.
      if (view === 'who' && MODE === 'device' && C.current) view = 'home';
      render();
    }
  }

  let syncing = false, again = false, kickTimer = null;
  const kick = () => { clearTimeout(kickTimer); kickTimer = setTimeout(sync, 300); };
  async function sync() {
    if (!sb) return;
    if (syncing) { again = true; return; }
    syncing = true;
    try {
      const r = await outbox.flush(handle, (op, e) => console.warn('Nem menthető, kimarad:', op, e));
      if (r !== 'offline') await pull();
    } catch (e) { /* hálózati hiba: később újra */ }
    finally { syncing = false; if (again) { again = false; kick(); } }
  }
  window.addEventListener('online', kick);

      sb = deviceClient();

  /* ================= szintek, jelvények ================= */
  const LEVELS = ['Kezdő', 'Felfedező', 'Ügyes', 'Gyors', 'Okos', 'Bajnok', 'Mester', 'Zseni', 'Legenda'];
  const need = n => 50 * n * (n - 1);
  const levelOf = p => { let n = 1; while (need(n + 1) <= p) n++; return n; };
  const lvName = n => LEVELS[Math.min(n, LEVELS.length) - 1];
  const BADGES = [
    { id: 'elso', ico: '🌱', name: 'Első kör', desc: 'Játssz végig egy kört.', ok: s => s.rounds >= 1 },
    { id: 'tokeletes', ico: '⭐', name: 'Tökéletes kör', desc: 'Válaszolj mind a 10 kérdésre helyesen.', ok: (s, c) => c.score === 10 },
    { id: 'ot', ico: '🔥', name: 'Öt egyvégtében', desc: 'Egy körben 5 jó válasz egymás után.', ok: (s, c) => c.bestStreak >= 5 },

  const HM_WORDS = [['Rovar', ['hangya', 'méh', 'darázs', 'lepke', 'légy', 'szúnyog', 'szitakötő', 'sáska', 'szöcske', 'tücsök', 'bogár', 'katica', 'cserebogár', 'szarvasbogár', 'báb', 'lárva', 'csáp', 'potroh', 'tor', 'nektár']], ['Hüllő', ['kígyó', 'gyík', 'teknős', 'krokodil', 'sikló', 'kaméleon', 'béka', 'gőte', 'varangy', 'ebihal', 'lárva', 'pete', 'kétéltű', 'hüllő']], ['Hal', ['ponty', 'csuka', 'harcsa', 'keszeg', 'amur', 'busa', 'süllő', 'compó', 'kárász', 'balin', 'garda', 'pisztráng', 'ikra', 'kopoltyú', 'pikkely', 'úszó', 'ivadék', 'szálka']], ['Madár', ['harkály', 'varjú', 'bagoly', 'veréb', 'gólya', 'fecske', 'cinege', 'fácán', 'zöldike', 'vércse', 'strucc', 'pingvin', 'gyurgyalag', 'sárgarigó', 'kakas', 'hattyú']], ['Növényrész', ['gyökérzet', 'szár', 'levél', 'virág', 'termés', 'törzs', 'tűlevél', 'mag', 'rügy']], ['Állat', ELO.állat.concat(['kígyó', 'csiga', 'galamb', 'mókus', 'őz', 'egér', 'medúza', 'polip', 'kagyló', 'sirály', 'kecske', 'sertés'])], ['Növény', ELO.növény.filter(w => w.indexOf(' ') < 0).concat(['lucfenyő', 'tölgyfa', 'bükkfa', 'bukszus', 'tűztövis', 'vadrózsa', 'kökény', 'mamutfenyő', 'diófa', 'napraforgó', 'cserje'])],

  const HM_KEYS = 'aábcdeéfghiíjklmnoóöőprstuúüűvyz'.split('');

  let hmLast = '';
  function hmStart() {

  }
  // Segítség az akasztófában, kérésre (életet nem visz el).

  // 2.: állatnál és növénynél kép; más szónál még egy betű (a leggyakoribb ismeretlen).
  function hmHint() {
    if (!MG || MG.done || MG.hints.length >= 2) return;
    const unknown = MG.word.split('').filter(c => MG.got.indexOf(c) < 0);
    if (!unknown.length) return;
    if (MG.hints.length === 0) {
      const k = unknown[0];
      MG.hints.push(`1. segítség: megmutattam egy betűt: <b>${k.toUpperCase()}</b>`);
      return hmGuess(k);
    }
    const emo = EMO[MG.word];
    if ((MG.cat === 'Állat' || MG.cat === 'Növény') && emo) {
      MG.hints.push(`2. segítség: ${emo} Ez egy ${MG.cat === 'Állat' ? 'állat' : 'növény'}.`);
      return render();
    }
    const freq = {}; unknown.forEach(c => { freq[c] = (freq[c] || 0) + 1; });
    const k = Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0];
    MG.hints.push(`2. segítség: még egy betű: <b>${k.toUpperCase()}</b>`);

  }
  function hmGuess(k) {
    if (!MG || MG.done || MG.got.indexOf(k) >= 0 || MG.miss.indexOf(k) >= 0 || HM_KEYS.indexOf(k) < 0) return;
    (MG.word.indexOf(k) >= 0 ? MG.got : MG.miss).push(k);

      MG.done = 1; S.points += 10; S.mgWins++;

  }
  function hmSvg(n) {

    const P = [`<line x1="100" y1="14" x2="100" y2="36" ${st}/>`, `<circle cx="100" cy="48" r="12" ${ac}/>`, `<line x1="100" y1="60" x2="100" y2="112" ${ac}/>`,
      `<line x1="100" y1="74" x2="82" y2="96" ${ac}/>`, `<line x1="100" y1="74" x2="118" y2="96" ${ac}/>`, `<line x1="100" y1="112" x2="84" y2="142" ${ac}/>`, `<line x1="100" y1="112" x2="116" y2="142" ${ac}/>`];

<section class="card hm"><p class="hint">Tipp: ${MG.cat}, ${w.length} betű</p>${MG.hints.map(h => `<p class="hint hmhint">${h}</p>`).join('')}${hmSvg(MG.miss.length)}<div class="slots" aria-label="A kitalálandó szó">${slots}</div>${end}
${MG.done ? '' : `<div class="hmhelp">${MG.hints.length < 2 ? `<button class="small-btn" data-go="hmhint">💡 ${MG.hints.length + 1}. segítség</button>` : ''}</div>`}
${MG.done ? '' : `<p class="lives">Hibázhatsz még ${HM_MAX - MG.miss.length}-szer.</p>`}</section>
${MG.done ? '' : `<div class="kb" role="group" aria-label="Betűk">${keys}</div>`}${btns}`;
  }


  /* ================= mini játék: falbontó ================= */
  // Egyszerű, gyorsan kijátszható falbontó: 2 × 6 tégla, 3 élet. A színek az aktuális témából
  // jönnek (CSS-változók). Ütő: ujjal húzva / egérrel, vagy a nyilakkal; indítás: koppintás / szóköz.
  let BO = null, boRaf = 0;
  const BO_W = 300, BO_H = 400, BO_ROWS = 2, BO_COLS = 6, BO_LIVES = 3;
  const BO_PW = 64, BO_PH = 10, BO_PY = BO_H - 28, BO_BR = 7, BO_SPEED = 230;
  const BO_TOP = 54, BO_BH = 20, BO_GAP = 6, BO_MX = 12;
  function boStart() {
    const bw = (BO_W - 2 * BO_MX - (BO_COLS - 1) * BO_GAP) / BO_COLS, bricks = [];
    for (let r = 0; r < BO_ROWS; r++) for (let c = 0; c < BO_COLS; c++) bricks.push({ r, x: BO_MX + c * (bw + BO_GAP), y: BO_TOP + r * (BO_BH + BO_GAP), w: bw, h: BO_BH, alive: true });
    BO = { lives: BO_LIVES, bricks, done: 0, ready: true, px: BO_W / 2, bx: BO_W / 2, by: BO_PY - BO_BR - 1, vx: 0, vy: 0, speed: BO_SPEED, last: 0, badge: null, colors: null };
    view = 'bo'; render(); window.scrollTo(0, 0);
  }
  function boView() {
    const end = BO.done === 1 ? `<div class="banner">Lebontottad a falat! +10 pont${BO.badge ? ', új jelvény: ' + BO.badge.ico + ' ' + BO.badge.name : ''}</div>`
      : BO.done === 2 ? '<div class="banner">Most nem sikerült. Legközelebb menni fog!</div>' : '';
    return `<div class="qbar"><button class="icon-btn" data-go="home" aria-label="Kilépés a játékból">←</button><div class="qtitle">Falbontó</div><div class="qcount" aria-label="Életek">${'❤️'.repeat(BO.lives)}</div></div>
<section class="card bo"><p class="hint">${BO.done ? '' : 'Húzd az ütőt az ujjaddal (vagy a nyilakkal), és koppints az indításhoz. Ne engedd leesni a labdát!'}</p><canvas id="boCanvas" width="${BO_W * 2}" height="${BO_H * 2}" aria-label="Falbontó játéktér"></canvas>${end}</section>
${BO.done ? '<button class="big-btn" data-go="home">Vissza a témákhoz</button>' : ''}`;
  }
  function boMount() {
    const cv = document.getElementById('boCanvas'); if (!cv || !BO) return;
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    BO.colors = { bg: v('--bg'), rows: [v('--accent'), v('--fg-muted')], paddle: v('--fg'), ball: v('--accent-text'), line: v('--line') };
    const toX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * BO_W; };
    cv.addEventListener('pointerdown', e => { if (BO.done) return; BO.px = toX(e); boLaunch(); });
    cv.addEventListener('pointermove', e => { if (!BO.done) BO.px = toX(e); });
    boDraw();
    if (!BO.done && !boRaf) { BO.last = 0; boRaf = requestAnimationFrame(boFrame); }
  }
  function boLaunch() {
    if (!BO || BO.done || !BO.ready) return;
    const a = (Math.random() * 50 - 25) * Math.PI / 180;
    BO.vx = BO.speed * Math.sin(a); BO.vy = -BO.speed * Math.cos(a); BO.ready = false;
  }
  function boFrame(t) {
    if (view !== 'bo' || !BO || BO.done || !document.getElementById('boCanvas')) { boRaf = 0; return; }
    const dt = BO.last ? Math.min(0.033, (t - BO.last) / 1000) : 0; BO.last = t;
    if (document.visibilityState !== 'hidden') boStep(dt);
    boDraw();
    boRaf = BO.done ? 0 : requestAnimationFrame(boFrame);
  }
  function boStep(dt) {
    BO.px = Math.max(BO_PW / 2, Math.min(BO_W - BO_PW / 2, BO.px));
    if (BO.ready) { BO.bx = BO.px; BO.by = BO_PY - BO_BR - 1; return; }
    BO.bx += BO.vx * dt; BO.by += BO.vy * dt;
    if (BO.bx < BO_BR) { BO.bx = BO_BR; BO.vx = Math.abs(BO.vx); }
    if (BO.bx > BO_W - BO_BR) { BO.bx = BO_W - BO_BR; BO.vx = -Math.abs(BO.vx); }
    if (BO.by < BO_BR) { BO.by = BO_BR; BO.vy = Math.abs(BO.vy); }
    // Ütő: a találat helye szabja meg a visszapattanás szögét (legfeljebb 60°).
    if (BO.vy > 0 && BO.by + BO_BR >= BO_PY && BO.by + BO_BR <= BO_PY + BO_PH + 8 && Math.abs(BO.bx - BO.px) <= BO_PW / 2 + BO_BR) {
      const off = Math.max(-1, Math.min(1, (BO.bx - BO.px) / (BO_PW / 2))), a = off * 60 * Math.PI / 180;
      BO.vx = BO.speed * Math.sin(a); BO.vy = -BO.speed * Math.cos(a); BO.by = BO_PY - BO_BR;
    }
    for (const b of BO.bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(BO.bx, b.x + b.w)), cy = Math.max(b.y, Math.min(BO.by, b.y + b.h));
      if ((BO.bx - cx) ** 2 + (BO.by - cy) ** 2 > BO_BR * BO_BR) continue;
      b.alive = false;
      if (cx === b.x || cx === b.x + b.w) BO.vx = -BO.vx; else BO.vy = -BO.vy;
      BO.speed *= 1.03; const k = BO.speed / Math.hypot(BO.vx, BO.vy); BO.vx *= k; BO.vy *= k;
      break;
    }
    if (BO.bricks.every(b => !b.alive)) return boEnd(true);
    if (BO.by - BO_BR > BO_H) {
      BO.lives--;
      if (BO.lives <= 0) return boEnd(false);
      BO.ready = true;
      const q = document.querySelector('.qbar .qcount'); if (q) q.textContent = '❤️'.repeat(BO.lives);
    }
  }
  function boEnd(won) {
    BO.done = won ? 1 : 2;
    if (won) {
      S.points += 10; S.boWins++;
      BADGES.forEach(b => { if (!S.badges[b.id] && b.ok(S, {})) { S.badges[b.id] = dayStr(new Date()); BO.badge = b; } });

    render();
  }
  function boDraw() {
    const cv = document.getElementById('boCanvas'); if (!cv || !BO || !BO.colors) return;

    // A roundRect régebbi Safarikban (iOS 15) nincs: ott sima téglalap.
    const box = (x, y, w, h) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, 5); else c.rect(x, y, w, h); c.fill(); };
    for (const b of BO.bricks) if (b.alive) { c.fillStyle = C.rows[b.r % C.rows.length]; box(b.x, b.y, b.w, b.h); }

  }

  /* ================= mini játék: szókereső ================= */
  const WS_N = 10, WS_DIR = [[0, 1], [1, 0], [1, 1]];
  function wsStart() {
    const cats = HM_WORDS.map(([c, ws]) => [c, ws.filter(w => w.length >= 3 && w.length <= 9 && w.split('').every(k => HM_KEYS.indexOf(k) >= 0))]);
    const [cat, ws] = pick(cats.filter(c => c[1].length >= 8));
    for (let tries = 0; tries < 200; tries++) {
      const grid = Array.from({ length: WS_N }, () => Array(WS_N).fill('')), words = [];
      const pickW = shuffle(ws).slice(0, rnd(5, 6)).sort((a, b) => b.length - a.length);
      let ok = true;
      for (const w of pickW) {
        let placed = false;
        for (let k = 0; k < 120 && !placed; k++) {
          const d = pick(WS_DIR), r = rnd(0, WS_N - 1 - d[0] * (w.length - 1)), c = rnd(0, WS_N - 1 - d[1] * (w.length - 1));
          const cells = w.split('').map((ch, i) => [r + d[0] * i, c + d[1] * i]);
          if (cells.every(([y, x], i) => !grid[y][x] || grid[y][x] === w[i])) { cells.forEach(([y, x], i) => grid[y][x] = w[i]); words.push({ w, cells, found: false }); placed = true; }
        }
        if (!placed) { ok = false; break; }
      }
      if (!ok) continue;
      for (let y = 0; y < WS_N; y++) for (let x = 0; x < WS_N; x++) if (!grid[y][x]) grid[y][x] = pick(HM_KEYS.filter(k => 'aeiouáéíóöőúüűyz'.indexOf(k) < 0 || Math.random() < 0.6));
      WS = { cat, grid, words, sel: null, hit: {}, done: 0 }; view = 'ws'; render(); window.scrollTo(0, 0); return;
    }
  }
  function wsTap(y, x) {
    if (!WS || WS.done) return;
    if (!WS.sel) { WS.sel = [y, x]; return render(); }
    const [y0, x0] = WS.sel, dy = y - y0, dx = x - x0, n = Math.max(Math.abs(dy), Math.abs(dx));
    if (n === 0) { WS.sel = null; return render(); }
    if (dy !== 0 && dx !== 0 && Math.abs(dy) !== Math.abs(dx)) { WS.sel = [y, x]; return render(); }
    const cells = []; for (let i = 0; i <= n; i++) cells.push([y0 + Math.sign(dy) * i, x0 + Math.sign(dx) * i]);
    const str = cells.map(([a, b]) => WS.grid[a][b]).join(''), rev = str.split('').reverse().join('');
    const hit = WS.words.find(o => !o.found && (o.w === str || o.w === rev));
    WS.sel = null;
    if (hit) {
      hit.found = true; cells.forEach(([a, b]) => WS.hit[a + ',' + b] = 1);
      if (WS.words.every(o => o.found)) {
        WS.done = 1; S.points += 10; S.wsWins++;
