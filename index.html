<style>
  /* A laszlobiri design system alapján (tokens.css a laszlobiri.com-ról). Egyetlen, sötét (palakék) megjelenés. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-sans); font-size: 17px; line-height: 26px;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 600px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    padding: max(var(--space-4), env(safe-area-inset-top)) var(--space-4) max(var(--space-12), env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  h1, h2, h3, p { margin: 0; }
  .mk .f{fill:var(--mark-filler)}.mk .l{fill:var(--mark-l)}.mk .b{fill:var(--mark-b)}.mk .lr{stroke:var(--mark-l)}.mk .br{stroke:var(--mark-ring)}
  .mk circle[stroke-width] { fill: none; }

  /* ---------- fejléc ---------- */
  .head { display: flex; align-items: center; gap: var(--space-4); margin: var(--space-4) 0 var(--space-6); }
  .head .mk { width: 64px; height: auto; flex: none; }
  .head h1 { font-size: 34px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: var(--fg-muted); font-size: 15px; line-height: 22px; }

  /* ---------- kártyák ---------- */
  .card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-6); }
  .level { display: flex; flex-direction: column; gap: var(--space-3); }
  .level .row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
  .level .lv { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .level .lv small { font-size: 15px; font-weight: 500; color: var(--accent-text); margin-left: var(--space-2); }
  .level .pts { font-size: 15px; color: var(--fg-muted); }
  .bar { height: 12px; border-radius: var(--radius-full); background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: var(--radius-full); }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-2); }
  .mini div { border-top: 1px solid var(--line); padding-top: var(--space-3); font-size: 14px; line-height: 20px; color: var(--fg-muted); }
  .mini b { display: block; font-size: 22px; line-height: 28px; font-weight: 600; color: var(--fg); }
  .link-btn { background: none; border: 0; padding: 0; text-align: left; color: var(--accent-text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

  .big-btn {
    display: flex; align-items: center; justify-content: center; gap: var(--space-3);
    width: 100%; min-height: 64px; margin-top: var(--space-4);
    background: var(--accent); color: var(--brand-black); border: 0; border-radius: var(--radius-lg);
    font-size: 20px; font-weight: 600; letter-spacing: -0.01em; padding: var(--space-3) var(--space-6);
  }
  .big-btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .big-btn:active { transform: translateY(1px); }

  h2.group { font-size: 14px; line-height: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-muted); margin: var(--space-8) 0 var(--space-3); }
  .topics { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
  .topic {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); text-align: left;
    min-height: 132px; padding: var(--space-4);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
  }
  .topic:hover { border-color: var(--accent); }
  .ico {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    border: 2px solid var(--accent); color: var(--accent-text);
    font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: -0.02em;
  }
  .ico.sm { font-size: 15px; }
  .ico.emo { font-size: 22px; }
  .topic .name { font-size: 18px; line-height: 22px; font-weight: 600; margin-top: auto; }
  .topic .best { font-size: 14px; line-height: 20px; color: var(--fg-muted); }

  /* ---------- kvíz ---------- */
  .qbar { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-2) 0 var(--space-4); }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--bg-raised); border: 1px solid var(--line); font-size: 22px; line-height: 1;
  }
  .qtitle { flex: 1; min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .qcount { font-size: 15px; color: var(--fg-muted); font-weight: 500; }
  .chip { display: inline-flex; align-items: center; font-size: 14px; line-height: 20px; font-weight: 500; padding: 2px var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-full); color: var(--fg-muted); }
  .chip.hot { color: var(--accent-text); border-color: currentColor; }

  .dots { display: flex; gap: 8px; justify-content: space-between; margin-bottom: var(--space-6); }
  .dot { flex: 1; max-width: 22px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); }
  .dot.now { border-color: var(--accent); }
  .dot.ok { background: var(--accent); border-color: var(--accent); }
  .dot.bad { border-color: var(--fg-muted); border-style: dashed; }
  .dots.big { justify-content: center; gap: 10px; width: 100%; }
  .dots.big .dot { max-width: 26px; }

  .qcard { padding: var(--space-8) var(--space-6); text-align: center; display: flex; flex-direction: column; gap: var(--space-3); align-items: center; }
  .qprompt { font-size: 16px; line-height: 22px; color: var(--fg-muted); }
  .qtext { font-size: 38px; line-height: 46px; font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .hl { color: var(--accent-text); border-bottom: 3px solid var(--accent); padding: 0 2px; }
  .qtext.svg { font-size: 16px; width: 100%; }
  .qtext.svg svg { width: 100%; height: auto; display: block; }
  .qtext.mid { font-size: 30px; line-height: 38px; }
  .qtext.long { font-size: 22px; line-height: 32px; font-weight: 500; letter-spacing: 0; text-align: left; }
  .blank { display: inline-block; min-width: 1.5em; margin: 0 .1em; border-bottom: 4px solid var(--accent); color: var(--accent-text); text-align: center; line-height: 1; }

  .choices { display: grid; gap: var(--space-3); margin-top: var(--space-4); grid-template-columns: 1fr; }
  .choices.grid { grid-template-columns: repeat(2, 1fr); }
  .choices.grid3 { grid-template-columns: repeat(3, 1fr); }
  .choice {
    position: relative; min-height: 68px; padding: var(--space-3) var(--space-4);
    background: var(--bg-raised); border: 2px solid var(--line); border-radius: var(--radius-lg);
    font-size: 20px; line-height: 26px; font-weight: 600; text-align: center;
  }
  .choices.grid3 .choice { font-size: 30px; line-height: 36px; min-height: 76px; padding: var(--space-3) var(--space-2); }
  .choices.grid .choice { font-size: 30px; line-height: 36px; min-height: 76px; }
  .choice:not(:disabled):hover { border-color: var(--accent); }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--accent); border-color: var(--accent); color: var(--brand-black); }
  .choice.wrong { border-style: dashed; border-color: var(--fg-muted); color: var(--fg-muted); text-decoration: line-through; }
  .choice.dim { opacity: .5; }
  .choice .mark { position: absolute; top: 6px; right: 12px; font-size: 18px; line-height: 1; text-decoration: none; }

  .fb { margin-top: var(--space-4); padding: var(--space-4) var(--space-6); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-raised); }
  .fb.good { border-color: var(--accent); }
  .fb h3 { font-size: 22px; line-height: 28px; font-weight: 600; }
  .fb.good h3 { color: var(--accent-text); }
  .fb p { color: var(--fg-muted); margin-top: var(--space-2); font-size: 16px; line-height: 24px; }
  .fb .plus { float: right; font-size: 22px; font-weight: 700; color: var(--accent-text); }

  /* ---------- eredmény ---------- */
  .result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-8) var(--space-6); }
  .result .score { font-size: 72px; line-height: 76px; font-weight: 700; letter-spacing: -0.04em; }
  .result .score small { font-size: 32px; color: var(--fg-muted); letter-spacing: -0.02em; }
  .result h2 { font-size: 24px; line-height: 30px; font-weight: 600; }
  .earn { font-size: 20px; font-weight: 600; color: var(--accent-text); }
  .mgoffer { text-align: center; display: flex; flex-direction: column; gap: var(--space-3); align-items: center; border-color: var(--accent); }
  .mgoffer h3 { margin: 0; font-size: 22px; line-height: 28px; }
  .mgoffer p { margin: 0; color: var(--fg-muted); }
  .mgoffer .row2 { display: flex; gap: var(--space-3); width: 100%; }
  .mgoffer .row2 .big-btn { margin: 0; flex: 1; }
  .hm { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
  .hm svg { width: 150px; height: auto; }
  .hm .hint { color: var(--fg-muted); margin: 0; font-size: 16px; text-align: center; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .slot { min-width: 28px; height: 44px; border-bottom: 4px solid var(--fg-muted); font-size: 30px; line-height: 40px; font-weight: 600; text-align: center; text-transform: uppercase; }
  .slot.lost { color: var(--accent-text); }
  .kb { margin-top: var(--space-4); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .key { width: 42px; height: 48px; padding: 0; border-radius: var(--radius-md); background: var(--bg-raised); border: 2px solid var(--line); color: var(--fg); font: inherit; font-size: 20px; font-weight: 600; text-transform: uppercase; }
  .key:not(:disabled):hover { border-color: var(--accent); }
  .key.hit { background: var(--accent); border-color: var(--accent); color: var(--brand-black); }
  .key.miss { border-style: dashed; border-color: var(--fg-muted); color: var(--fg-muted); text-decoration: line-through; }
  .hm .lives { color: var(--fg-muted); margin: 0; font-size: 15px; }
  .ws { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-4); }
  .wgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: 100%; max-width: 380px; }
  .wc { aspect-ratio: 1; padding: 0; min-width: 0; border-radius: 8px; background: var(--bg); border: 2px solid transparent; color: var(--fg); font: inherit; font-size: 17px; font-weight: 600; text-transform: uppercase; }
  .wc.sel { border-color: var(--accent); color: var(--accent-text); }
  .wc.hit { background: var(--accent); color: var(--brand-black); }
  .wlist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0; padding: 0; list-style: none; }
  .wlist li { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 16px; font-weight: 600; text-transform: uppercase; }
  .wlist li.got { background: var(--accent); border-color: var(--accent); color: var(--brand-black); text-decoration: line-through; }
  .banner { width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--accent); border-radius: var(--radius-md); color: var(--accent-text); font-weight: 600; }
  .newb { width: 100%; display: flex; flex-direction: column; gap: var(--space-2); }
  .newb .it { display: flex; align-items: center; gap: var(--space-3); text-align: left; padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); }
  .newb .ic { font-size: 28px; line-height: 1; flex: none; }
  .newb .tx { font-size: 16px; line-height: 22px; }

  /* ---------- jelvények ---------- */
  .badges { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
  .badge { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); background: transparent; }
  .badge .bi { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; flex: none; border: 2px dashed var(--line); filter: grayscale(1); opacity: .5; }
  .badge.got { background: var(--bg-raised); }
  .badge.got .bi { border: 2px solid var(--accent); filter: none; opacity: 1; }
  .badge b { display: block; font-size: 18px; line-height: 24px; font-weight: 600; }
  .badge span { color: var(--fg-muted); font-size: 15px; line-height: 22px; }
  .badge:not(.got) b { color: var(--fg-muted); }

  /* ---------- gyerekprofil, szülői nézet, párosítás ---------- */
  .whobar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin: 0 0 var(--space-4); }
  .whobar .me { font-size: 20px; line-height: 28px; }
  .whobar .me b { font-weight: 600; }
  .topic.who .ico { font-size: 40px; }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .card h3 { margin: 0 0 var(--space-2); font-size: 20px; line-height: 26px; font-weight: 600; }
  .card + .card, .card + .big-btn { margin-top: var(--space-4); }
  .inp { width: 100%; min-height: 48px; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 18px; }
  .inp:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .inp.code { text-transform: uppercase; letter-spacing: .15em; text-align: center; font-size: 24px; }
  .avs { display: flex; flex-wrap: wrap; gap: var(--space-2); border: 0; padding: 0; margin: 0; }
  .avs label { cursor: pointer; }
  .avs input { position: absolute; opacity: 0; }
  .avs span { display: grid; place-items: center; width: 52px; height: 52px; font-size: 30px; border-radius: 50%; border: 2px solid var(--line); }
  .avs input:checked + span { border-color: var(--accent); background: var(--bg); }
  .avs input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
  .checks label { display: flex; gap: var(--space-3); align-items: center; font-size: 18px; min-height: 44px; }
  .checks input { width: 22px; height: 22px; accent-color: var(--accent); }
  .rowi { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; border-top: 1px solid var(--line); }
  .rowi:first-of-type { border-top: 0; }
  .rowi .sub { margin: 0; }
  .small-btn { min-height: 40px; padding: 0 var(--space-4); border-radius: var(--radius-full); border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 15px; font-weight: 500; flex: none; }
  .small-btn.danger { color: var(--accent-text); }
  .codebox { white-space: nowrap; font-size: clamp(26px, 9vw, 40px); line-height: 48px; font-weight: 700; letter-spacing: .1em; text-align: center; padding: var(--space-4); border: 2px dashed var(--accent); border-radius: var(--radius-md); }
  .msg { min-height: 22px; margin: 0; color: var(--accent-text); font-size: 15px; line-height: 22px; }
  .recent { margin: var(--space-2) 0 0; padding: 0; list-style: none; font-size: 15px; line-height: 22px; color: var(--fg-muted); }
  .foot lb-auth { display: flex; justify-content: center; margin-top: var(--space-3); }
  .foot { margin-top: var(--space-12); font-size: 14px; line-height: 20px; color: var(--fg-muted); text-align: center; }
  @media (max-width: 380px) { .qtext { font-size: 32px; line-height: 40px; } .choices.grid .choice { font-size: 26px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<div id="app"><noscript>Az oldalhoz JavaScript kell.</noscript></div>

<script type="module">
// A gyakorló a laszlobiri közös backendjébe ment (gyerekprofilok, eredmények, jelvények).
// Két üzemmód: szülő (Google-belépés, közös süti) és gyerek tablet (párosított, névtelen
// eszközfiók, csak a hozzá rendelt gyerekprofilokkal). Terv: laszlobiri-com/docs/backend-terv.md, 3. fázis.
import { isDevice, deviceClient, deviceReady, pair, unpair, validPin, forgetDevice } from 'https://laszlobiri.com/lib/v1/device.js';
import { createOutbox } from 'https://laszlobiri.com/lib/v1/outbox.js';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from 'https://laszlobiri.com/lib/v1/config.js';
const LIB = 'https://laszlobiri.com/lib/v1/';

(function () {
  'use strict';

  /* ================= segédek ================= */
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[rnd(0, a.length - 1)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const $app = document.getElementById('app');

  /* számválaszok: a helyes + 3 hihető rossz, egyedi értékekkel */
  function numQ(c, cands, extra) {
    const opts = [];
    for (const v of shuffle(cands)) {
      if (Number.isInteger(v) && v >= 0 && v !== c && opts.indexOf(v) < 0) { opts.push(v); if (opts.length === 3) break; }
    }
    for (let d = 1; opts.length < 3; d++) {
      [c + d, c - d].forEach(v => { if (opts.length < 3 && v >= 0 && v !== c && opts.indexOf(v) < 0) opts.push(v); });
    }
    const all = shuffle([c].concat(opts));
    return Object.assign({ choices: all.map(String), correct: all.indexOf(c), layout: 'grid' }, extra);
  }
  const near = c => [c + 10, c - 10, c + 1, c - 1, c + 100, c - 100, c + 2, c - 2];

  /* ================= témák és feladatgenerátorok ================= */
  const GEN = {
    jly() {
      const LY = [['he', ''], ['go', 'ó'], ['fo', 'ó'], ['kirá', ''], ['mé', ''], ['', 'uk'], ['pehe', ''], ['kö', 'ök'], ['bago', ''], ['gó', 'a'], ['fo', 'ik'], ['hó', 'ag'], ['me', 'ik'], ['mi', 'en']];
      const J = [['', 'áték'], ['ha', 'ó'], ['a', 'tó'], ['ma', 'om'], ['pa', 'tás'], ['a', 'ándék'], ['é', 'szaka'], ['ba', 'usz'], ['te', ''], ['fe', ''], ['va', 'on'], ['sa', 't'], ['ha', 'nal']];
      const isLy = Math.random() < 0.5, w = pick(isLy ? LY : J), ans = isLy ? 'ly' : 'j';
      return { prompt: 'Melyik betű hiányzik?', text: `${w[0]}<span class="blank">?</span>${w[1]}`, choices: ['j', 'ly'], correct: ans === 'j' ? 0 : 1, layout: 'grid', explain: `Így helyes: ${w[0]}${ans}${w[1]}.` };
    },
    szofaj() {
      const W = {
        'főnév': ['ház', 'kutya', 'asztal', 'madár', 'iskola', 'könyv', 'fa', 'labda', 'barát', 'tenger'],
        'melléknév': ['nagy', 'piros', 'szép', 'kerek', 'vidám', 'hideg', 'gyors', 'kicsi', 'magas', 'édes'],
        'ige': ['fut', 'olvas', 'alszik', 'ír', 'rajzol', 'játszik', 'úszik', 'eszik', 'ugrik', 'nevet']
      };
      const H = { 'főnév': 'ki? mi?', 'melléknév': 'milyen?', 'ige': 'mit csinál?' };
      const types = ['főnév', 'melléknév', 'ige'], t = pick(types), w = pick(W[t]);

        () => { const a = rnd(20, 70), b = rnd(20, 70), s = a + b + 50; return exprQ('Szöveges feladat', `Csenge gyümölcssalátát készít. ${a} dkg mandarint, ${b} dkg ananászt és fél kg almát vásárolt. Hány dkg gyümölcsöt vásárolt összesen?`, s, `${a}+${b}+50`, [s - 50, s + 50, s + 10, s - 10, s - 100, a + b + 5], `Fél kg = 50 dkg, így ${a} + ${b} + 50 = ${s}.`, { key: `sz3:${a}:${b}`, long: true }); },
        () => { const x = rnd(1, 19) * 5; return exprQ('Szöveges feladat', `A recept ${x} dkg lisztet kér. Hány dkg lisztet kell venni dupla adaghoz?`, 2 * x, `2*${x}`, [x, x + 10, 2 * x + 10, 2 * x - 10, 2 * x + 5], `Dupla adag: 2 · ${x} = ${2 * x}.`, { key: 'sz4:' + x, long: true }); },
        () => { const p = pick([20, 30, 40, 50]), k = rnd(2, Math.min(9, Math.floor(200 / p))), c = p * k; return exprQ('Szöveges feladat', `Egy füzet ${p} Ft. ${k} füzet hány forintba kerül?`, c, `${p}*${k}`, [c + p, c - p, c + 10, c - 10, p + k], `${k} · ${p} = ${c}`, { key: `sz5:${p}:${k}`, long: true }); },
        () => { const n = pick(NAMES1), a = t10(20, 120), b = t10(10, 200 - a), c = a + b; return exprQ('Szöveges feladat', `${n} ${a} Ft-ért ceruzát és ${b} Ft-ért radírt vett. Mennyit fizetett összesen?`, c, `${a}+${b}`, [c + 10, c - 10, a - b > 0 ? a - b : c + 20, c + 20, c - 20], `${a} + ${b} = ${c}`, { key: `sz6:${a}:${b}`, long: true }); },
        () => { const g = pick([20, 30, 40, 50, 60]), q = rnd(2, Math.min(9, Math.floor(200 / g))), tot = g * q; return exprQ('Szöveges feladat', `Egy gyerek ${tot} Ft-ot oszt ${g} Ft-os csoportokra. Hány csoport lesz?`, q, `${tot}/${g}`, [q + 1, q - 1, q + 2, q - 2, g], `${tot} : ${g} = ${q}`, { key: `sz7:${g}:${q}`, long: true }); },
        () => { const x = rnd(10, 19) * 10 + rnd(0, 9), y = rnd(30, x - 20), d = x - y; return exprQ('Szöveges feladat', `Máté ${x} dkg lisztet használt, Réka ${y} dkg lisztet. Hány dkg a különbség?`, d, `${x}-${y}`, [d + 10, d - 10, x + y > 200 ? d + 20 : x + y, d + 1, d - 1], `${x} − ${y} = ${d}`, { key: `sz8:${x}:${y}`, long: true }); },
        () => { const k = rnd(2, 6), t = t10(10, Math.floor(200 / k / 10) * 10), c = k * t; return exprQ('Szöveges feladat', `Egy dobozban ${t} ceruza van. ${k} dobozban hány ceruza van összesen?`, c, `${k}*${t}`, [c + t, c - t, c + 10, c - 10, k + t], `${k} · ${t} = ${c}`, { key: `sz9:${k}:${t}`, long: true }); },
        () => { const k = rnd(2, 8), t = t10(10, Math.floor(200 / k / 10) * 10), p = k * t; return exprQ('Szöveges feladat', `${p} Ft-ot egyenlően elosztanak ${k} gyerek között. Hány forint jut egy gyereknek?`, t, `${p}/${k}`, [t + 10, t - 10 >= 10 ? t - 10 : t + 20, k, p - k, t + 20], `${p} : ${k} = ${t}`, { key: `sz10:${k}:${t}`, long: true }); }
      ];
      return pick(T)();
    },

    meres() {
      const T = [
        () => {
          const K = [
            () => { const k = rnd(1, 2); return [`${k} kg = ? dkg`, k * 100, `${k} kg = ${k * 100} dkg`, `${k}*100`]; },
            () => [`fél kg = ? dkg`, 50, 'Fél kg = 50 dkg', '50'],
            () => { const d = rnd(1, 99); return [`1 kg ${d} dkg = ? dkg`, 100 + d, `1 kg = 100 dkg, így 1 kg ${d} dkg = ${100 + d} dkg.`, `100+${d}`]; },
            () => { const k = rnd(1, 2); return [`${k} m = ? cm`, k * 100, `${k} m = ${k * 100} cm`, `${k}*100`]; },
            () => { const c = rnd(1, 99); return [`1 m ${c} cm = ? cm`, 100 + c, `1 m = 100 cm, így 1 m ${c} cm = ${100 + c} cm.`, `100+${c}`]; },
            () => { const k = rnd(1, 2); return [`${k * 100} dkg = ? kg`, k, `${k * 100} dkg = ${k} kg`, String(k)]; },
            () => { const k = rnd(1, 2); return [`${k * 100} cm = ? m`, k, `${k * 100} cm = ${k} m`, String(k)]; }
          ], [text, ans, ex, expr] = pick(K)();
          return exprQ('Váltsd át!', text, ans, expr, [ans * 10, ans % 10 === 0 ? ans / 10 : ans + 10, ans + 10, ans - 10, ans + 1, ans - 1, ans + 50].filter(v => v > 0), ex, { key: 'conv:' + text });
        },
        () => {
          const n = rnd(101, 199), d = n - 100, unit = pick([['kg', 'dkg'], ['m', 'cm']]), good = `1 ${unit[0]} ${d} ${unit[1]}`;
          const pool = [`1 ${unit[0]} ${d + 10 <= 99 ? d + 10 : d - 10 >= 1 ? d - 10 : d + 1} ${unit[1]}`, `2 ${unit[0]} ${d} ${unit[1]}`, `1 ${unit[0]} ${d % 10 * 10 + Math.floor(d / 10)} ${unit[1]}`, `11 ${unit[0]} ${d} ${unit[1]}`, `1 ${unit[0]} ${d + 1 <= 99 ? d + 1 : d - 1} ${unit[1]}`];
          return mc('Váltsd át!', `${n} ${unit[1]} = ?`, good, pool, `${n} ${unit[1]} = 100 ${unit[1]} + ${d} ${unit[1]} = ${good}`, { key: `conv2:${n}:${unit[0]}`, meta: { conv2: [n, good] } });
        },
        () => {
          const [big, small] = pick([['kg', 'dkg'], ['m', 'cm']]), k = rnd(1, 2), eq = Math.random() < 0.2, d = eq ? k * 100 : rnd(30, 199), left = Math.random() < 0.5;
          const bt = `${k} ${big}`, st = `${d} ${small}`; const l = left ? k * 100 : d, r = left ? d : k * 100;
          return cmpQ('Hasonlítsd össze a mennyiségeket!', left ? `${bt} ○ ${st}` : `${st} ○ ${bt}`, l, r, `1 ${big} = 100 ${small}, így ${k} ${big} = ${k * 100} ${small}.`, { key: `cmpm:${bt}:${st}:${left}`, long: false });
        },
        () => {
          const lo = rnd(30, 190), hi = lo + rnd(3, 12), c = rnd(lo + 1, hi - 1), big = hi === 100;
          return numQ(c, [lo, hi, lo - 1, hi + 1, lo - 2, hi + 2, lo - 3, hi + 3], { prompt: 'Melyik szám lehet a ? helyén (dkg)?', text: big ? `${100} dkg > ? > ${lo} dkg`.replace('100 dkg', '1 kg') : `${lo} dkg < ? < ${hi} dkg`, long: false, key: `mbtw:${lo}:${hi}:${c}`, explain: `${lo} < ${c} < ${hi}`, meta: { between: [lo, hi] } });
        },
        () => {
          const x = t10(10, 100), y = t10(10, 100), s = x + y, z = t10(10, s - 10), c = s - z;
          return exprQ('Hány dkg kell a jobb serpenyőbe, hogy a mérleg egyensúlyban legyen?', `Bal: ${x} dkg + ${y} dkg<br>Jobb: ${z} dkg + ? dkg`, c, `${x}+${y}-${z}`, [c + 10, c - 10, s, z, c + 20, c - 20], `Bal: ${x} + ${y} = ${s} dkg. ${s} − ${z} = ${c}.`, { key: `bal:${x}:${y}:${z}`, long: false });
        }
      ];
      return pick(T)();
    },

    penz() {
      const T = [
        () => { const c = randCoins(), s = c.reduce((a, b) => a + b, 0); return exprQ('Mennyi pénz van a tárcában?', c.slice().sort((a, b) => b - a).map(v => v + ' Ft').join(' · '), s, c.join('+'), [s + 10, s - 10, s + 20, s - 20, s + 30, s - 30, s + 50, s - 50], `${c.join(' + ')} = ${s} Ft`, { key: 'wal:' + c.slice().sort().join(), long: false }); },
        () => {
          const c = randCoins(), s = c.reduce((a, b) => a + b, 0), good = coinsLabel(c), bad = new Set();
          for (let i = 0; i < 80 && bad.size < 3; i++) { const o = randCoins(); const so = o.reduce((a, b) => a + b, 0); if (so !== s) bad.add(coinsLabel(o)); }
          return mc('Melyik érmékkel fizethető ki pontosan?', `${s} Ft`, good, Array.from(bad), `${good} = ${s}`, { key: 'pay:' + s + ':' + good, meta: { coins: [s, good] } });
        },
        () => { const p = t10(20, 190), c = 200 - p; return exprQ('Mennyi a visszajáró?', `Fizetsz 200 Ft-tal. A vásárlás ${p} Ft.`, c, `200-${p}`, [c + 10, c - 10, c + 20, c - 20, p], `200 − ${p} = ${c}`, { key: 'chg:' + p, long: false }); }
      ];
      return pick(T)();
    }
  });

  const TOPICS = [
    { id: 'szamok200', g: 'Matek', name: 'Számok 200-ig', ico: '200', sm: 1 },
    { id: 'helyiertek', g: 'Matek', name: 'Helyi érték', ico: '123', sm: 1 },
    { id: 'szamegyenes', g: 'Matek', name: 'Számegyenes', ico: '↔' },
    { id: 'szomszed', g: 'Matek', name: 'Számszomszédok, kerekítés', ico: '≈' },
    { id: 'osszkiv', g: 'Matek', name: 'Összeadás, kivonás', ico: '±' },
    { id: 'szorosz', g: 'Matek', name: 'Szorzás, osztás', ico: '×÷', sm: 1 },

    { id: 'allat', g: 'Környezetismeret', name: 'Állatcsoportok', ico: '🐾', emo: 1 },
    { id: 'emlos', g: 'Környezetismeret', name: 'Emlősök', ico: '🐕', emo: 1 },
    { id: 'madar', g: 'Környezetismeret', name: 'Madarak', ico: '🐦', emo: 1 },
    { id: 'hullo', g: 'Környezetismeret', name: 'Hüllők', ico: '🐍', emo: 1 },
    { id: 'ketelt', g: 'Környezetismeret', name: 'Kétéltűek', ico: '🐸', emo: 1 },
    { id: 'rovar', g: 'Környezetismeret', name: 'Rovarok és bogarak', ico: '🐞', emo: 1 }
  ];
  const TNAME = {}; TOPICS.forEach(t => TNAME[t.id] = t.name); TNAME.vegyes = 'Vegyes kör';

  function makeQuestion(topic) {
    const id = topic === 'vegyes' ? pick(TOPICS).id : topic;
    const q = GEN[id](); q.topic = id; return q;
  }
  function buildRound(topic) {
    const qs = [], seen = {};
    for (let tries = 0; qs.length < 10 && tries < 400; tries++) {
      const q = makeQuestion(topic);
      const k = q.topic + (q.key || q.text); if (!seen[k]) { seen[k] = 1; qs.push(q); }
    }
    while (qs.length < 10) qs.push(makeQuestion(topic));
    return qs;
  }

  /* ================= mentés: a háztartás közös adatai ================= */
  // Döntés: a régi, belépés nélküli pontok nem kerülnek át; az új verzió törli őket.
  try { localStorage.removeItem('gyakorlo.v1'); } catch (e) {}
  const def = () => ({ points: 0, answered: 0, correct: 0, rounds: 0, perfect: 0, best: {}, played: {}, badges: {}, days: 0, lastDay: '', mgDone: 0, mgWins: 0, mgN: 0, wsWins: 0 });
  const CACHE_KEY = 'gyakorlo.v2';
  const outbox = createOutbox('gyakorlo.outbox.v1');
  const AVATARS = { fox: '🦊', owl: '🦉', cat: '🐱', bear: '🐻', frog: '🐸', bee: '🐝', rabbit: '🐰', turtle: '🐢' };
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const esc = v => String(v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  // 'parent': szülő; 'device': gyerek tablet; 'pair': párosító oldal (#parositas).
  let MODE = isDevice() ? 'device' : location.hash === '#parositas' ? 'pair' : 'parent';
  let sb = null;
  let C = loadCache();
  let S = def();
  let msg = '';                 // üzenet a szülői / párosító nézetben
  let devices = null;           // a szülői nézet eszközlistája
  let pairCode = null;          // a legutóbb kért párosító kód
  let pairFromParent = false;   // a szülő ezt az eszközt teszi gyerek tabletté
  let kidExitWarn = false;

  function emptyCache() { return { pupils: [], results: {}, badges: {}, current: null, userId: null, householdId: null }; }
  function loadCache() {
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c && Array.isArray(c.pupils)) return Object.assign(emptyCache(), c); } catch (e) {}
    return emptyCache();
  }
  function saveCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(C)); } catch (e) { /* nincs tárhely */ } }
  const pupil = () => C.pupils.find(p => p.id === C.current) || null;

  // A gyerek állapota (pont, szint, sorozat, legjobbak, jelvények) az eredményekből számolódik.
  function computeState(pid) {
    const s = def(), days = [];
    const rs = (C.results[pid] || []).slice().sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
    for (const r of rs) {
      s.points += r.points | 0;
      if (r.kind === 'round') {
        s.answered += r.answered | 0; s.correct += r.correct | 0; s.rounds++;
        if (r.score === 10) s.perfect++;
        s.best[r.topic] = Math.max(s.best[r.topic] || 0, r.score | 0);
        if (r.topic !== 'vegyes') s.played[r.topic] = 1;
        const d = dayStr(new Date(r.created_at));
        if (days[days.length - 1] !== d) days.push(d);
      } else if (r.kind === 'hangman') s.mgWins++;
      else if (r.kind === 'wordsearch') s.wsWins++;
    }
    // Napi sorozat: az utolsó gyakorlási napig egymást követő napok száma.
    let run = days.length ? 1 : 0;
    for (let i = days.length - 2; i >= 0; i--) {
      const prev = new Date(days[i + 1] + 'T12:00:00'); prev.setDate(prev.getDate() - 1);
      if (dayStr(prev) === days[i]) run++; else break;
    }
    s.days = run; s.lastDay = days[days.length - 1] || '';
    s.mgDone = Math.floor(s.points / 50); s.mgN = s.mgDone;
    Object.assign(s.badges, C.badges[pid] || {});
    return s;
  }
  const refreshS = () => { S = C.current ? computeState(C.current) : def(); };

  // Egy befejezett kör vagy minijáték mentése (azonnal helyben, a sorban a szerver felé).
  function record(kind, f) {
    const p = pupil(); if (!p) return;
    const row = { id: crypto.randomUUID(), pupil_id: p.id, kind, topic: f.topic ?? null, score: f.score ?? 0, best_streak: f.best_streak ?? 0,
      answered: f.answered ?? 0, correct: f.correct ?? 0, points: f.points ?? 0, created_at: new Date().toISOString() };
    (C.results[p.id] ||= []).push(row);
    outbox.enqueue({ t: 'result', row });
    const have = (C.badges[p.id] ||= {});
    for (const [id, day] of Object.entries(S.badges)) {
      if (have[id]) continue;
      have[id] = day;
      outbox.enqueue({ t: 'badge', row: { pupil_id: p.id, badge_id: id, earned_at: new Date().toISOString() } });
    }
    saveCache(); kick();
  }

  async function handle(op) {
    const { error } = await sb.from(op.t === 'result' ? 'results' : 'pupil_badges').insert(op.row);
    if (error && error.code !== '23505') throw error;   // 23505: már fent van (ismételt küldés)
  }

  async function pull() {
    const pr = await sb.from('pupils').select('id, nickname, avatar').order('created_at');
    if (pr.error) throw pr.error;
    C.pupils = pr.data.filter(p => UUID.test(p.id)).map(p => ({ id: p.id, nickname: String(p.nickname), avatar: AVATARS[p.avatar] ? p.avatar : 'fox' }));
    const ids = C.pupils.map(p => p.id);
    C.results = {}; C.badges = {};
    if (ids.length) {
      const [r, b] = await Promise.all([
        sb.from('results').select('id, pupil_id, kind, topic, score, best_streak, answered, correct, points, created_at').in('pupil_id', ids).order('created_at'),
        sb.from('pupil_badges').select('pupil_id, badge_id, earned_at').in('pupil_id', ids),
      ]);
      if (r.error) throw r.error;
      if (b.error) throw b.error;
      for (const x of r.data) (C.results[x.pupil_id] ||= []).push(x);
      for (const x of b.data) (C.badges[x.pupil_id] ||= {})[x.badge_id] = dayStr(new Date(x.earned_at));
    }
    // A még el nem küldött eredmények és jelvények.
    for (const op of outbox.pending()) {
      if (op.t === 'result' && C.results[op.row.pupil_id] && !C.results[op.row.pupil_id].some(x => x.id === op.row.id)) C.results[op.row.pupil_id].push(op.row);
      if (op.t === 'badge' && C.badges[op.row.pupil_id]) C.badges[op.row.pupil_id][op.row.badge_id] ??= dayStr(new Date(op.row.earned_at));
    }
    if (MODE === 'parent' && !C.householdId) {
      const h = await sb.from('households').select('id').limit(1).maybeSingle();
      if (!h.error && h.data) C.householdId = h.data.id;
    }
    if (C.current && !ids.includes(C.current)) C.current = null;
    if (MODE === 'device' && ids.length === 1) C.current = ids[0];
    saveCache();
    // Játék közben és a szülői / párosító űrlapokon nem rajzolunk újra.
    if (['home', 'who', 'badges'].includes(view)) {
      refreshS();
      if (view === 'home' && !C.current) view = 'who';
      // Gyerek tablet egy hozzárendelt gyerekkel: rögtön az ő kezdőképernyője.
      if (view === 'who' && MODE === 'device' && C.current) view = 'home';
      render();
    }
  }

  let syncing = false, again = false, kickTimer = null;
  const kick = () => { clearTimeout(kickTimer); kickTimer = setTimeout(sync, 300); };
  async function sync() {
    if (!sb) return;
    if (syncing) { again = true; return; }
    syncing = true;
    try {
      const r = await outbox.flush(handle, (op, e) => console.warn('Nem menthető, kimarad:', op, e));
      if (r !== 'offline') await pull();
    } catch (e) { /* hálózati hiba: később újra */ }
    finally { syncing = false; if (again) { again = false; kick(); } }
  }
  window.addEventListener('online', kick);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') kick(); });

  function reveal() { document.getElementById('lb-gate')?.remove(); document.documentElement.style.visibility = ''; }
  function adopt(user) {
    // Másik fiók (pl. szülőből gyerek tablet lett): a helyi másolat és a sor az előzőé.
    if (user && C.userId && C.userId !== user.id) { C = emptyCache(); outbox.clear(); }
    if (user) C.userId = user.id;
    saveCache();
  }

  async function init() {
    if (MODE === 'pair') { reveal(); view = 'pair'; render(); return; }
    if (MODE === 'device') {
      const r = await deviceReady();
      if (r.revoked) { C = emptyCache(); outbox.clear(); saveCache(); MODE = 'pair'; view = 'pair'; msg = 'A gyerek mód megszűnt ezen a tableten. Párosítsd újra.'; render(); return; }
      sb = deviceClient();
      adopt(r.user);
    } else {
      const [{ ready }, { supabase }] = await Promise.all([import(LIB + 'gate.js'), import(LIB + 'client.js')]);
      import(LIB + 'auth-badge.js');
      const r = await ready;
      sb = supabase;
      adopt(r.user);
    }
    refreshS();
    view = C.current ? 'home' : 'who';
    render();
    sync();
  }

  /* ================= szintek, jelvények ================= */
  const LEVELS = ['Kezdő', 'Felfedező', 'Ügyes', 'Gyors', 'Okos', 'Bajnok', 'Mester', 'Zseni', 'Legenda'];
  const need = n => 50 * n * (n - 1);
  const levelOf = p => { let n = 1; while (need(n + 1) <= p) n++; return n; };
  const lvName = n => LEVELS[Math.min(n, LEVELS.length) - 1];
  const BADGES = [
    { id: 'elso', ico: '🌱', name: 'Első kör', desc: 'Játssz végig egy kört.', ok: s => s.rounds >= 1 },
    { id: 'tokeletes', ico: '⭐', name: 'Tökéletes kör', desc: 'Válaszolj mind a 10 kérdésre helyesen.', ok: (s, c) => c.score === 10 },
    { id: 'ot', ico: '🔥', name: 'Öt egyvégtében', desc: 'Egy körben 5 jó válasz egymás után.', ok: (s, c) => c.bestStreak >= 5 },
    { id: 'szorzo', ico: '✖️', name: 'Szorzótábla-mester', desc: 'Hibátlan kör a szorzás, osztás témából.', ok: (s, c) => c.topic === 'szorosz' && c.score === 10 },
    { id: 'helyesiras', ico: '✏️', name: 'Helyesírás-bajnok', desc: 'Hibátlan kör a j vagy ly? témából.', ok: (s, c) => c.topic === 'jly' && c.score === 10 },
    { id: 'minden', ico: '🧭', name: 'Mindent kipróbáltam', desc: 'Játssz végig egy kört minden témából.', ok: s => TOPICS.every(t => s.played[t.id]) },
    { id: 'harom', ico: '📅', name: 'Három nap egymás után', desc: 'Gyakorolj három egymást követő napon.', ok: s => s.days >= 3 },
    { id: 'szaz', ico: '💯', name: 'Száz jó válasz', desc: 'Gyűjts össze 100 helyes választ.', ok: s => s.correct >= 100 },
    { id: 'szojatek', ico: '🔤', name: 'Szókitaláló', desc: 'Találj ki egy szót az akasztófa játékban.', ok: s => s.mgWins >= 1 },
    { id: 'szokereso', ico: '🔎', name: 'Szókereső', desc: 'Találd meg az összes szót a szókeresőben.', ok: s => s.wsWins >= 1 },
    { id: 'ot-szint', ico: '🏆', name: 'Ötödik szint', desc: 'Érd el az 5. szintet.', ok: s => levelOf(s.points) >= 5 }
  ];

  const dayStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function touchDay() {
    const now = new Date(), today = dayStr(now);
    if (S.lastDay === today) return;
    const y = new Date(now); y.setDate(y.getDate() - 1);
    S.days = S.lastDay === dayStr(y) ? S.days + 1 : 1; S.lastDay = today;
  }

  /* ================= állapot ================= */
  let view = 'home', Q = null, R = null, MG = null, WS = null;

  function start(topic) {
    if (!pupil()) { view = 'who'; render(); return; }
    Q = { topic, qs: buildRound(topic), i: 0, picked: null, res: [], score: 0, streak: 0, bestStreak: 0, lv0: levelOf(S.points) };
    view = 'quiz'; render();
  }
  function answer(i) {
    if (!Q || Q.picked !== null) return;
    const q = Q.qs[Q.i], ok = i === q.correct;
    Q.picked = i; Q.res[Q.i] = ok;
    if (ok) { Q.score++; Q.streak++; Q.bestStreak = Math.max(Q.bestStreak, Q.streak); } else Q.streak = 0;
    render(); const b = document.getElementById('next'); if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest' }); }
  }
  function next() {
    if (Q.i < 9) { Q.i++; Q.picked = null; render(); window.scrollTo(0, 0); } else finish();
  }
  function finish() {
    // Döntés: csak a befejezett kör számít; a pontok itt, egyszerre íródnak.
    const bonus = Q.score === 10 ? 50 : 0;
    S.points += Q.score * 10 + bonus; S.answered += 10; S.correct += Q.score;
    S.rounds++; if (bonus) S.perfect++;
    S.best[Q.topic] = Math.max(S.best[Q.topic] || 0, Q.score);
    if (Q.topic !== 'vegyes') S.played[Q.topic] = 1;
    touchDay();
    const fresh = [], ctx = { topic: Q.topic, score: Q.score, bestStreak: Q.bestStreak };
    BADGES.forEach(b => { if (!S.badges[b.id] && b.ok(S, ctx)) { S.badges[b.id] = dayStr(new Date()); fresh.push(b); } });
    const mgNow = Math.floor(S.points / 50), mgOffer = mgNow > S.mgDone, mgKind = S.mgN % 2 ? 'ws' : 'hm'; S.mgDone = mgNow; if (mgOffer) S.mgN++;
    record('round', { topic: Q.topic, score: Q.score, best_streak: Q.bestStreak, answered: 10, correct: Q.score, points: Q.score * 10 + bonus });
    R = { mg: mgOffer, mgKind, topic: Q.topic, score: Q.score, res: Q.res.slice(), earned: Q.score * 10 + bonus, bonus, lv0: Q.lv0, lv1: levelOf(S.points), fresh };
    view = 'result'; render(); window.scrollTo(0, 0);
  }


  /* ================= mini játék: akasztófa ================= */
  const HM_WORDS = [['Állat', ALLN.concat(['pók', 'csiga', 'giliszta', 'szitakötő'])],
    ['Természet', ['víz', 'levegő', 'fény', 'meleg', 'táplálék', 'szőr', 'toll', 'pikkely', 'kitinpáncél', 'emlős', 'madár', 'hüllő', 'kétéltű', 'rovar', 'gerinc', 'csontváz', 'ikra', 'ebihal', 'hernyó', 'báb', 'tojás', 'fészek', 'növény', 'állat']],
    ['Matek', ['összeadás', 'kivonás', 'szorzás', 'osztás', 'számegyenes', 'kerekítés', 'tízes', 'százas', 'egyes', 'páros', 'páratlan', 'mérleg', 'forint', 'visszajáró', 'kilogramm', 'méter', 'centiméter', 'dekagramm', 'szomszéd']],
    ['Nyelvtan', ['főnév', 'melléknév', 'ige', 'mondat', 'kérdő', 'kijelentő', 'felkiáltó', 'óhajtó', 'betű', 'ábécé', 'szófaj', 'helyesírás', 'játék', 'hajó', 'király', 'bagoly', 'kölyök']]];
  const HM_KEYS = 'aábcdeéfghiíjklmnoóöőprstuúüűvyz'.split('');
  const HM_MAX = 7;
  let hmLast = '';
  function hmStart() {
    const pool = [];
    HM_WORDS.forEach(([cat, ws]) => ws.forEach(w => { if (w.length >= 3 && w.split('').every(c => HM_KEYS.indexOf(c) >= 0) && w !== hmLast) pool.push([cat, w]); }));
    const [cat, word] = pick(pool); hmLast = word;
    MG = { cat, word, got: [], miss: [], done: 0 }; view = 'mg'; render(); window.scrollTo(0, 0);
  }
  function hmGuess(k) {
    if (!MG || MG.done || MG.got.indexOf(k) >= 0 || MG.miss.indexOf(k) >= 0 || HM_KEYS.indexOf(k) < 0) return;
    (MG.word.indexOf(k) >= 0 ? MG.got : MG.miss).push(k);
    if (MG.word.split('').every(c => MG.got.indexOf(c) >= 0)) {
      MG.done = 1; S.points += 10; S.mgWins++;
      BADGES.forEach(b => { if (!S.badges[b.id] && b.ok(S, {})) { S.badges[b.id] = dayStr(new Date()); MG.badge = b; } });
      record('hangman', { points: 10 });
    } else if (MG.miss.length >= HM_MAX) MG.done = 2;
    render();
  }
  function hmSvg(n) {
    const st = 'stroke="var(--fg)" stroke-width="4" stroke-linecap="round" fill="none"', ac = 'stroke="var(--accent)" stroke-width="4" stroke-linecap="round" fill="none"';
    const base = `<line x1="10" y1="170" x2="110" y2="170" ${st}/><line x1="35" y1="170" x2="35" y2="14" ${st}/><path d="M35 14 H100" ${st}/>`;
    const P = [`<line x1="100" y1="14" x2="100" y2="36" ${st}/>`, `<circle cx="100" cy="48" r="12" ${ac}/>`, `<line x1="100" y1="60" x2="100" y2="112" ${ac}/>`,
      `<line x1="100" y1="74" x2="82" y2="96" ${ac}/>`, `<line x1="100" y1="74" x2="118" y2="96" ${ac}/>`, `<line x1="100" y1="112" x2="84" y2="142" ${ac}/>`, `<line x1="100" y1="112" x2="116" y2="142" ${ac}/>`];
    return `<svg viewBox="0 0 140 184" role="img" aria-label="${n} hiba a ${HM_MAX}-ből">${base}${P.slice(0, n).join('')}</svg>`;
  }
  function mgView() {
    const w = MG.word, lost = MG.done === 2;
    const slots = w.split('').map(c => { const on = MG.got.indexOf(c) >= 0; return `<span class="slot${!on && lost ? ' lost' : ''}">${on || lost ? c : ''}</span>`; }).join('');
    const keys = HM_KEYS.map(k => `<button class="key${MG.got.indexOf(k) >= 0 ? ' hit' : MG.miss.indexOf(k) >= 0 ? ' miss' : ''}" data-k="${k}"${MG.done || MG.got.indexOf(k) >= 0 || MG.miss.indexOf(k) >= 0 ? ' disabled' : ''} aria-label="${k}">${k}</button>`).join('');
    const end = MG.done === 1 ? `<div class="banner">Kitaláltad! +10 pont${MG.badge ? ' · Új jelvény: ' + MG.badge.ico + ' ' + MG.badge.name : ''}</div>` : lost ? `<div class="banner">Most nem sikerült. A szó: <b>${w}</b></div>` : '';
    const btns = MG.done ? `<button class="big-btn" data-go="mg-hm">Még egy szó</button><button class="big-btn ghost" data-go="home">Vissza a témákhoz</button>` : '';
    return `<div class="qbar"><button class="icon-btn" data-go="home" aria-label="Kilépés a játékból">←</button><div class="qtitle">Akasztófa</div></div>
<section class="card hm"><p class="hint">Tipp: ${MG.cat} · ${w.length} betű</p>${hmSvg(MG.miss.length)}<div class="slots" aria-label="A kitalálandó szó">${slots}</div>${end}
${MG.done ? '' : `<p class="lives">Hibázhatsz még ${HM_MAX - MG.miss.length}-szer.</p>`}</section>
${MG.done ? '' : `<div class="kb" role="group" aria-label="Betűk">${keys}</div>`}${btns}`;
  }


  /* ================= mini játék: szókereső ================= */
  const WS_N = 10, WS_DIR = [[0, 1], [1, 0], [1, 1]];
  function wsStart() {
    const cats = HM_WORDS.map(([c, ws]) => [c, ws.filter(w => w.length >= 3 && w.length <= 9 && w.split('').every(k => HM_KEYS.indexOf(k) >= 0))]);
    const [cat, ws] = pick(cats.filter(c => c[1].length >= 8));
    for (let tries = 0; tries < 200; tries++) {
      const grid = Array.from({ length: WS_N }, () => Array(WS_N).fill('')), words = [];
      const pickW = shuffle(ws).slice(0, rnd(5, 6)).sort((a, b) => b.length - a.length);
      let ok = true;
      for (const w of pickW) {
        let placed = false;
        for (let k = 0; k < 120 && !placed; k++) {
          const d = pick(WS_DIR), r = rnd(0, WS_N - 1 - d[0] * (w.length - 1)), c = rnd(0, WS_N - 1 - d[1] * (w.length - 1));
          const cells = w.split('').map((ch, i) => [r + d[0] * i, c + d[1] * i]);
          if (cells.every(([y, x], i) => !grid[y][x] || grid[y][x] === w[i])) { cells.forEach(([y, x], i) => grid[y][x] = w[i]); words.push({ w, cells, found: false }); placed = true; }
        }
        if (!placed) { ok = false; break; }
      }
      if (!ok) continue;
      for (let y = 0; y < WS_N; y++) for (let x = 0; x < WS_N; x++) if (!grid[y][x]) grid[y][x] = pick(HM_KEYS.filter(k => 'aeiouáéíóöőúüűyz'.indexOf(k) < 0 || Math.random() < 0.6));
      WS = { cat, grid, words, sel: null, hit: {}, done: 0 }; view = 'ws'; render(); window.scrollTo(0, 0); return;
    }
  }
  function wsTap(y, x) {
    if (!WS || WS.done) return;
    if (!WS.sel) { WS.sel = [y, x]; return render(); }
    const [y0, x0] = WS.sel, dy = y - y0, dx = x - x0, n = Math.max(Math.abs(dy), Math.abs(dx));
    if (n === 0) { WS.sel = null; return render(); }
    if (dy !== 0 && dx !== 0 && Math.abs(dy) !== Math.abs(dx)) { WS.sel = [y, x]; return render(); }
    const cells = []; for (let i = 0; i <= n; i++) cells.push([y0 + Math.sign(dy) * i, x0 + Math.sign(dx) * i]);
    const str = cells.map(([a, b]) => WS.grid[a][b]).join(''), rev = str.split('').reverse().join('');
    const hit = WS.words.find(o => !o.found && (o.w === str || o.w === rev));
    WS.sel = null;
    if (hit) {
      hit.found = true; cells.forEach(([a, b]) => WS.hit[a + ',' + b] = 1);
      if (WS.words.every(o => o.found)) {
        WS.done = 1; S.points += 10; S.wsWins++;
        BADGES.forEach(b => { if (!S.badges[b.id] && b.ok(S, {})) { S.badges[b.id] = dayStr(new Date()); WS.badge = b; } });
        record('wordsearch', { points: 10 });
      }
    }
    render();
  }
  function wsView() {
    const cells = WS.grid.map((row, y) => row.map((ch, x) => `<button class="wc${WS.hit[y + ',' + x] ? ' hit' : ''}${WS.sel && WS.sel[0] === y && WS.sel[1] === x ? ' sel' : ''}" data-r="${y}" data-c="${x}" aria-label="${ch}, ${y + 1}. sor, ${x + 1}. oszlop">${ch}</button>`).join('')).join('');
    const list = WS.words.map(o => `<li class="${o.found ? 'got' : ''}">${o.w}</li>`).join('');
    const end = WS.done ? `<div class="banner">Megtaláltál mindent! +10 pont${WS.badge ? ' · Új jelvény: ' + WS.badge.ico + ' ' + WS.badge.name : ''}</div>` : '';
    return `<div class="qbar"><button class="icon-btn" data-go="home" aria-label="Kilépés a játékból">←</button><div class="qtitle">Szókereső</div><div class="qcount">${WS.words.filter(o => o.found).length}/${WS.words.length}</div></div>
<section class="card ws"><p class="hint" style="margin:0;color:var(--fg-muted);text-align:center">Téma: ${WS.cat}. Koppints a szó első, majd utolsó betűjére. A szó lehet vízszintes, függőleges vagy átlós.</p>
<div class="wgrid" role="group" aria-label="Betűtábla">${cells}</div><ul class="wlist" aria-label="Keresendő szavak">${list}</ul>${end}</section>
${WS.done ? `<button class="big-btn" data-go="mg-ws">Új tábla</button><button class="big-btn ghost" data-go="home">Vissza a témákhoz</button>` : ''}`;
  }

  /* ================= nézetek ================= */
  const MARK = '<svg class="mk" viewBox="0 0 81 53" role="img" aria-label="laszlobiri jel"><g transform="rotate(180 40.5 26.5)"><g transform="translate(81 0) rotate(90)"><circle class="f" cx="47.5" cy="5.5" r="4"/><circle class="f" cx="33.5" cy="19.5" r="4"/><circle class="f" cx="47.5" cy="33.5" r="4"/><circle class="f" cx="33.5" cy="47.5" r="4"/><circle class="l" cx="5.5" cy="5.5" r="4"/><circle class="l" cx="5.5" cy="19.5" r="4"/><circle class="l" cx="5.5" cy="33.5" r="4"/><circle class="l" cx="5.5" cy="47.5" r="4"/><circle class="l" cx="5.5" cy="61.5" r="4"/><circle class="l" cx="5.5" cy="75.5" r="4"/><circle class="l" cx="19.5" cy="75.5" r="4"/><circle class="l" cx="33.5" cy="75.5" r="4"/><circle class="l" cx="47.5" cy="75.5" r="4"/><circle class="b" cx="19.5" cy="5.5" r="4"/><circle class="b" cx="19.5" cy="19.5" r="4"/><circle class="b" cx="19.5" cy="33.5" r="4"/><circle class="b" cx="19.5" cy="47.5" r="4"/><circle class="b" cx="19.5" cy="61.5" r="4"/><circle class="b" cx="33.5" cy="5.5" r="4"/><circle class="b" cx="33.5" cy="33.5" r="4"/><circle class="b" cx="47.5" cy="19.5" r="4"/><circle class="lr" cx="47.5" cy="61.5" r="3" fill="none" stroke-width="2"/><circle class="br" cx="33.5" cy="61.5" r="3" fill="none" stroke-width="2"/><circle class="br" cx="47.5" cy="47.5" r="3" fill="none" stroke-width="2"/></g></g></svg>';

  function dotsHtml(res, now, big) {
    let h = `<div class="dots${big ? ' big' : ''}" role="img" aria-label="${res.filter(Boolean).length} jó válasz a ${res.filter(v => v !== undefined).length} megválaszolt kérdésből">`;
    for (let i = 0; i < 10; i++) h += `<span class="dot ${res[i] === true ? 'ok' : res[i] === false ? 'bad' : i === now ? 'now' : ''}"></span>`;
    return h + '</div>';
  }

  function homeView() {
    const L = levelOf(S.points), a = need(L), b = need(L + 1), pct = Math.round((S.points - a) / (b - a) * 100);
    const topicBtn = t => {
      const best = S.best[t.id];
      return `<button class="topic" data-go="${t.id}"><span class="ico${t.sm ? ' sm' : ''}${t.emo ? ' emo' : ''}" aria-hidden="true">${t.ico}</span><span class="name">${t.name}</span><span class="best">${best === undefined ? 'még nem játszottad' : 'legjobb: ' + best + '/10'}</span></button>`;
    };
    const grp = g => `<h2 class="group">${g}</h2><div class="topics">${TOPICS.filter(t => t.g === g).map(topicBtn).join('')}</div>`;
    const got = Object.keys(S.badges).length;
    const p = pupil();
    const switchBtn = MODE === 'parent' || C.pupils.length > 1 ? '<button class="link-btn" data-go="who">Másik gyerek</button>' : '';
    return `<header class="head">${MARK}<div><h1>Gyakorló</h1><p class="sub">3. osztály · matek, nyelvtan, környezetismeret</p></div></header>
<div class="whobar"><div class="me">${AVATARS[p.avatar]} <b>${esc(p.nickname)}</b></div>${switchBtn}</div>
<section class="card level" aria-label="Szinted">
  <div class="row"><div class="lv">${L}. szint<small>${lvName(L)}</small></div><div class="pts">${S.points} pont</div></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
  <p class="sub">Még ${b - S.points} pont a ${L + 1}. szintig.</p>
  <div class="mini"><div><b>${S.days}</b>napja gyakorolsz egymás után</div><div><b>${S.correct}</b>jó válasz összesen</div><div><b>${got}/${BADGES.length}</b><button class="link-btn" data-go="badges">jelvényeim</button></div></div>
</section>
<button class="big-btn" data-go="vegyes"><span aria-hidden="true">★</span> Vegyes kör mindenből</button>
${grp('Matek')}${grp('Nyelvtan')}${grp('Környezetismeret')}
${footHtml()}`;
  }

  function footHtml() {
    const n = outbox.size();
    const st = n ? `<br>${navigator.onLine === false ? 'Offline' : 'Mentés'} · ${n} eredmény vár` : '';
    if (MODE === 'device') return `<p class="foot">A pontok a családi fiókba mentődnek.${st}<br><button class="link-btn" data-go="kidexit">Szülő</button></p>`;
    return `<p class="foot">A pontok a családi fiókba mentődnek.${st}<br><button class="link-btn" data-go="parent">Szülői nézet</button><lb-auth></lb-auth></p>`;
  }

  function whoView() {
    const cards = C.pupils.map(p => `<button class="topic who" data-pupil="${p.id}"><span class="ico emo" aria-hidden="true">${AVATARS[p.avatar]}</span><span class="name">${esc(p.nickname)}</span><span class="best">${levelOf(computeState(p.id).points)}. szint</span></button>`).join('');

      ? '<section class="card"><p>Ehhez a tablethez most nincs gyerek rendelve. Kérd meg a szülőt, hogy párosítsa újra.</p><button class="big-btn ghost" data-go="forget">Újrapárosítás</button></section>'
      : '<section class="card"><p>Még nincs gyerekprofil.</p><button class="big-btn" data-go="parent">Gyerekprofil létrehozása</button></section>';
    return `<header class="head">${MARK}<div><h1>Gyakorló</h1><p class="sub">3. osztály · matek, nyelvtan, környezetismeret</p></div></header>
<h2 class="group">Ki gyakorol?</h2>${C.pupils.length ? `<div class="topics">${cards}</div>` : none}${footHtml()}`;
  }

  /* ---------- szülői nézet ---------- */
  function parentView() {
    const rows = C.pupils.map(p => {
      const s = computeState(p.id), L = levelOf(s.points);
      const last = (C.results[p.id] || []).filter(r => r.kind === 'round').slice(-5).reverse()
        .map(r => `<li>${esc(dayStr(new Date(r.created_at)))} · ${esc(TNAME[r.topic] || r.topic)}: <b>${r.score | 0}/10</b></li>`).join('');
      return `<div class="rowi"><div><b>${AVATARS[p.avatar]} ${esc(p.nickname)}</b><p class="sub">${L}. szint · ${s.points} pont · ${s.rounds} kör · ${Object.keys(s.badges).length} jelvény${s.lastDay ? ' · utoljára: ' + esc(s.lastDay) : ''}</p>${last ? `<ul class="recent">${last}</ul>` : ''}</div><button class="small-btn danger" data-delpupil="${p.id}">Törlés</button></div>`;

    const checks = C.pupils.map(p => `<label><input type="checkbox" name="pp" value="${p.id}" checked> ${AVATARS[p.avatar]} ${esc(p.nickname)}</label>`).join('');
    const code = pairCode ? `<div class="codebox" aria-label="Párosító kód">${esc(pairCode)}</div><p class="sub">10 percig érvényes, egyszer használható. A tableten nyisd meg: <b>gyakorlas.laszlobiri.com/#parositas</b></p>` : '';
    return `<div class="qbar"><button class="icon-btn" data-go="who" aria-label="Vissza">←</button><div class="qtitle">Szülői nézet</div></div>
<p class="msg" role="status">${esc(msg)}</p>
<section class="card"><h3>Gyerekek</h3>${rows || '<p class="sub">Még nincs gyerekprofil.</p>'}</section>
<section class="card stack"><h3>Új gyerekprofil</h3><p class="sub">Csak becenevet adj meg, teljes nevet ne.</p>
<input class="inp" id="nick" maxlength="20" autocomplete="off" placeholder="Becenév" aria-label="Becenév">
<fieldset class="avs"><legend class="sub">Ikon</legend>${avs}</fieldset>
<button class="big-btn" data-go="addpupil">Létrehozás</button></section>
<section class="card stack"><h3>Gyerek tabletek</h3>${devs}
${C.pupils.length ? `<h3>Új tablet párosítása</h3><div class="checks">${checks}</div>
<input class="inp" id="dlabel" maxlength="30" value="Tablet" aria-label="A tablet neve">
<button class="big-btn" data-go="newcode">Párosító kód kérése</button>${code}
<button class="big-btn ghost" data-go="thisdevice">Ez az eszköz legyen a gyerek tablet</button>` : ''}</section>
${footHtml()}`;
  }

  async function loadDevices() {
    const [d, dp] = await Promise.all([
      sb.from('devices').select('user_id, label, last_seen_at').order('created_at'),
      sb.from('device_pupils').select('device_user_id, pupil_id'),
    ]);
    if (d.error || dp.error) { devices = []; msg = 'Az eszközlista nem tölthető be.'; return; }
    devices = d.data.filter(x => UUID.test(x.user_id)).map(x => ({ ...x,
      names: dp.data.filter(y => y.device_user_id === x.user_id).map(y => C.pupils.find(p => p.id === y.pupil_id)?.nickname).filter(Boolean).join(', ') || 'nincs gyerek' }));
  }
  async function openParent() { view = 'parent'; msg = ''; devices = null; render(); window.scrollTo(0, 0); await loadDevices(); if (view === 'parent') render(); }

  async function addPupil() {
    const nick = document.getElementById('nick').value.trim();
    const av = document.querySelector('input[name=av]:checked')?.value || 'fox';
    if (!nick || nick.length > 20) { msg = 'A becenév 1–20 karakter.'; return render(); }
    if (!C.householdId) { msg = 'Ehhez a fiókhoz nem tartozik háztartás.'; return render(); }
    const { error } = await sb.from('pupils').insert({ id: crypto.randomUUID(), household_id: C.householdId, nickname: nick, avatar: av });
    msg = error ? (error.code === '23505' ? 'Ilyen becenév már van.' : 'Nem sikerült létrehozni (van internet?).') : `${nick} profilja elkészült.`;
    if (!error) await pull().catch(() => {});
    render();
  }
  async function delPupil(id) {
    const p = C.pupils.find(x => x.id === id); if (!p) return;
    if (!confirm(`Biztosan törlöd ${p.nickname} profilját? Az összes eredménye és jelvénye is törlődik.`)) return;
    const { error } = await sb.from('pupils').delete().eq('id', id);
    msg = error ? 'Nem sikerült törölni.' : `${p.nickname} profilja törölve.`;
    if (!error) { if (C.current === id) C.current = null; await pull().catch(() => {}); }
    render();
  }
  async function revoke(uid) {
    if (!confirm('Visszavonod ezt a tabletet? Utána semmihez nem fér hozzá, újra párosítani kell.')) return;
    const { error } = await sb.from('devices').delete().eq('user_id', uid);
    msg = error ? 'Nem sikerült visszavonni.' : 'A tablet visszavonva.';
    await loadDevices(); render();
  }
  async function newCode() {
    const ids = [...document.querySelectorAll('input[name=pp]:checked')].map(x => x.value);
    const label = document.getElementById('dlabel').value.trim();
    if (!ids.length) { msg = 'Válassz legalább egy gyereket.'; return render(); }
    if (!label) { msg = 'Adj nevet a tabletnek.'; return render(); }
    const { data, error } = await sb.rpc('create_pairing', { p_pupils: ids, p_label: label });
    if (error) { msg = 'Nem sikerült kódot kérni (van internet?).'; pairCode = null; } else { msg = ''; pairCode = data; }
    render();
    return pairCode;
  }

  /* ---------- párosítás (a tableten) ---------- */
  function pairView() {
    return `<header class="head">${MARK}<div><h1>Gyakorló</h1><p class="sub">Gyerek tablet párosítása</p></div></header>
<section class="card stack"><h3>Párosítás</h3>
<p class="sub">Írd be a szülő telefonján kapott kódot, és adj meg egy 4 jegyű PIN-t. A PIN-nel lehet majd kilépni a gyerek módból.</p>
<input class="inp code" id="pcode" maxlength="9" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" aria-label="Párosító kód" value="${esc(pairFromParent && pairCode ? pairCode : '')}">
<input class="inp" id="ppin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN (4 számjegy)" aria-label="PIN">
<input class="inp" id="ppin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN még egyszer" aria-label="PIN még egyszer">
<button class="big-btn" data-go="dopair">Párosítás</button>
<p class="msg" role="status">${esc(msg)}</p>
${pairFromParent ? '<p class="sub">A párosítás után ezen az eszközön kilépsz a laszlobiri oldalakról.</p><button class="big-btn ghost" data-go="parent">Mégse</button>' : ''}</section>`;
  }

  // A szülő munkamenetének lezárása ezen az eszközön, a kapu átirányítása nélkül.
  async function dropParentSession() {
    try {
      const { supabase } = await import(LIB + 'client.js');
      const { data } = await supabase.auth.getSession();
      if (data.session) await fetch(SUPABASE_URL + '/auth/v1/logout?scope=local', { method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + data.session.access_token } });
    } catch (e) { /* a süti így is törlődik */ }
    for (const c of document.cookie.split(';')) {
      const n = c.split('=')[0].trim();
      if (/^sb-[a-z0-9]+-auth-token/.test(n)) ['', '; domain=.laszlobiri.com'].forEach(d => { document.cookie = n + '=; Max-Age=0; path=/' + d; });
    }
  }

  async function doPair() {
    const code = document.getElementById('pcode').value, pin = document.getElementById('ppin').value, pin2 = document.getElementById('ppin2').value;
    if (code.replace(/[^A-Za-z0-9]/g, '').length !== 8) { msg = 'A kód 8 karakter (pl. ABCD-EFGH).'; return render(); }
    if (!validPin(pin)) { msg = 'A PIN 4 számjegy.'; return render(); }
    if (pin !== pin2) { msg = 'A két PIN nem egyezik.'; return render(); }
    msg = 'Párosítás…'; render();
    try {
      const r = await pair(code, pin);
      if (r !== 'ok') { msg = 'Hibás vagy lejárt kód. Kérj újat a szülő telefonján.'; return render(); }
    } catch (e) {
      msg = /anonymous/i.test(String(e?.code || e?.message)) ? 'A gyerek mód még nincs bekapcsolva a szerveren.' : 'A párosítás nem sikerült (van internet?).';
      return render();
    }
    if (pairFromParent) await dropParentSession();
    try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    outbox.clear();
    location.replace(location.pathname);
  }

  /* ---------- kilépés a gyerek módból ---------- */
  function kidExitView() {
    const n = outbox.size();
    return `<div class="qbar"><button class="icon-btn" data-go="who" aria-label="Vissza">←</button><div class="qtitle">Szülő</div></div>
<section class="card stack"><h3>Kilépés a gyerek módból</h3>
<p class="sub">Add meg a párosításkor beállított PIN-t.</p>
<input class="inp" id="kpin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN" aria-label="PIN">
${n && kidExitWarn ? `<p class="msg">Még ${n} eredmény nincs elmentve (nincs internet). Ha most kilépsz, elvesznek.</p>` : ''}
<button class="big-btn" data-go="dokidexit">${n && kidExitWarn ? 'Kilépés mégis' : 'Kilépés'}</button>
<p class="msg" role="status">${esc(msg)}</p></section>`;
  }
  async function doKidExit() {
    const pin = document.getElementById('kpin').value;
    if (!validPin(pin)) { msg = 'A PIN 4 számjegy.'; return render(); }
    await sync();
    if (outbox.size() && !kidExitWarn) { kidExitWarn = true; msg = ''; return render(); }
    if (!(await unpair(pin))) { msg = 'Hibás PIN.'; return render(); }
    try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    outbox.clear();
    location.replace(location.pathname);
  }

  const PRAISE = ['Ügyes vagy!', 'Szuper!', 'Pontosan!', 'Nagyszerű!', 'Így van!', 'Remek!'];
  const OOPS = ['Majdnem!', 'Semmi baj, ebből tanulunk!', 'Nem ez volt, de menni fog!'];

  function quizView() {
    const q = Q.qs[Q.i], done = Q.picked !== null;
    const chips = Q.topic === 'vegyes' ? `<span class="chip">${TNAME[q.topic]}</span>` : '';
    const streak = Q.streak >= 3 ? `<span class="chip hot">🔥 ${Q.streak} egyvégtében</span>` : '';
    let ch = '';
    q.choices.forEach((c, i) => {
      let cls = 'choice', mark = '';
      if (done) {
        if (i === q.correct) { cls += ' right'; mark = '<span class="mark" aria-hidden="true">✓</span>'; }
        else if (i === Q.picked) { cls += ' wrong'; mark = '<span class="mark" aria-hidden="true">✕</span>'; }
        else cls += ' dim';
      }
      ch += `<button class="${cls}" data-pick="${i}"${done ? ' disabled' : ''}>${c}${mark}${done && i === Q.picked && i !== q.correct ? '<span class="sr" hidden> (a te válaszod)</span>' : ''}</button>`;
    });
    let fb = '';
    if (done) {
      const ok = Q.picked === q.correct, last = Q.i === 9;
      fb = `<div class="fb ${ok ? 'good' : ''}" role="status"><h3>${ok ? '<span class="plus">+10</span>' + pick(PRAISE) : pick(OOPS)}</h3><p>${q.explain}</p></div><button class="big-btn" id="next" data-next>${last ? 'Eredmény' : 'Tovább'} <span aria-hidden="true">→</span></button>`;
    }
    return `<div class="qbar"><button class="icon-btn" data-go="home" aria-label="Vissza a témákhoz">←</button><div class="qtitle">${TNAME[Q.topic]}</div><div class="qcount">${Q.i + 1}/10</div></div>
${dotsHtml(Q.res, Q.i)}
<section class="card qcard"><div>${chips} ${streak}</div><p class="qprompt">${q.prompt}</p><div class="qtext${q.svg ? ' svg' : q.long ? ' long' : (strip(q.text).length > 11 ? ' mid' : '')}">${q.text}</div></section>
<div class="choices ${q.layout}" role="group" aria-label="Válaszok">${ch}</div>${fb}`;
  }

  function resultView() {
    const s = R.score;
    const msg = s === 10 ? 'Tökéletes! Hibátlan kör!' : s >= 8 ? 'Nagyon ügyes vagy!' : s >= 5 ? 'Jó munka! Még egy kör, és tökéletes lesz.' : 'Gyakorolj még egy kört, menni fog!';
    const up = R.lv1 > R.lv0 ? `<div class="banner">Szintet léptél: ${R.lv1}. szint, ${lvName(R.lv1)}!</div>` : '';
    const nb = R.fresh.length ? `<div class="newb" aria-label="Új jelvények">${R.fresh.map(b => `<div class="it"><span class="ic" aria-hidden="true">${b.ico}</span><div class="tx"><b>${b.name}</b><br><span class="sub">${b.desc}</span></div></div>`).join('')}</div>` : '';
    return `<div class="qbar"><button class="icon-btn" data-go="home" aria-label="Vissza a témákhoz">←</button><div class="qtitle">${TNAME[R.topic]}</div></div>
<section class="card result"><div class="score">${s}<small>/10</small></div>${dotsHtml(R.res, -1, true)}<h2>${msg}</h2>
<p class="earn">+${R.earned} pont${R.bonus ? ' (benne: +' + R.bonus + ' bónusz a hibátlan körért)' : ''}</p>${up}${nb}</section>${R.mg ? `<section class="card mgoffer"><h3>${R.mgKind === 'ws' ? '🔎 Mini játék: szókereső' : '🔤 Mini játék: akasztófa'}</h3><p>Összegyűjtöttél újabb 50 pontot. ${R.mgKind === 'ws' ? 'Megkeresed az elrejtett szavakat?' : 'Kitalálsz egy szót?'}</p><div class="row2"><button class="big-btn" data-go="mg-${R.mgKind}">Játszom</button><button class="big-btn ghost" data-go="nomg">Most nem</button></div></section>` : ''}
<button class="big-btn" data-go="${R.topic}">Még egy kör</button><button class="big-btn ghost" data-go="home">Vissza a témákhoz</button>`;
  }

  function badgesView() {
    return `<div class="qbar"><button class="icon-btn" data-go="home" aria-label="Vissza a témákhoz">←</button><div class="qtitle">Jelvényeim</div><div class="qcount">${Object.keys(S.badges).length}/${BADGES.length}</div></div>
<div class="badges">${BADGES.map(b => { const d = S.badges[b.id]; return `<div class="badge${d ? ' got' : ''}"><div class="bi" aria-hidden="true">${b.ico}</div><div><b>${b.name}</b><span>${b.desc}${d ? ' · megszerezted: ' + d : ''}</span></div></div>`; }).join('')}</div>`;
  }

  function render() {
    $app.innerHTML = view === 'quiz' ? quizView() : view === 'result' ? resultView() : view === 'badges' ? badgesView() : view === 'mg' ? mgView() : view === 'ws' ? wsView()
      : view === 'who' ? whoView() : view === 'parent' ? parentView() : view === 'pair' ? pairView() : view === 'kidexit' ? kidExitView()
      : pupil() ? homeView() : whoView();
  }

  /* ================= események ================= */
  $app.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-pick],[data-next],[data-k],[data-r],[data-pupil],[data-delpupil],[data-revoke]'); if (!t) return;
    if (t.dataset.pupil) { C.current = t.dataset.pupil; saveCache(); refreshS(); view = 'home'; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.delpupil) return delPupil(t.dataset.delpupil);
    if (t.dataset.revoke) return revoke(t.dataset.revoke);
    if (t.hasAttribute('data-r')) return wsTap(+t.dataset.r, +t.dataset.c);
    if (t.hasAttribute('data-k')) return hmGuess(t.dataset.k);
    if (t.hasAttribute('data-pick')) return answer(+t.dataset.pick);
    if (t.hasAttribute('data-next')) return next();
    const g = t.dataset.go;
    if (g === 'mg-hm') return hmStart();
    if (g === 'mg-ws') return wsStart();
    if (g === 'nomg') { R.mg = false; render(); return; }
    if (g === 'who') { refreshS(); view = 'who'; msg = ''; render(); window.scrollTo(0, 0); return; }
    if (g === 'parent') { if (MODE === 'parent') { pairFromParent = false; openParent(); } return; }
    if (g === 'addpupil') return addPupil();
    if (g === 'newcode') return newCode();
    if (g === 'thisdevice') { pairFromParent = true; msg = ''; return newCode().then(c => { if (c) { view = 'pair'; render(); window.scrollTo(0, 0); } }); }
    if (g === 'dopair') return doPair();
    if (g === 'kidexit') { view = 'kidexit'; msg = ''; kidExitWarn = false; render(); return; }
    if (g === 'dokidexit') return doKidExit();
    if (g === 'forget') { forgetDevice().then(() => { C = emptyCache(); outbox.clear(); saveCache(); location.replace(location.pathname + '#parositas'); location.reload(); }); return; }
    if (g === 'home') { refreshS(); }
    if (g === 'home' || g === 'badges') { view = g; render(); window.scrollTo(0, 0); } else start(g);
  });
  document.addEventListener('keydown', e => {
    if (view === 'mg' && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) return hmGuess(e.key.toLowerCase());
    if (view !== 'quiz' || !Q || Q.picked !== null || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = parseInt(e.key, 10), q = Q.qs[Q.i];
    if (n >= 1 && n <= q.choices.length) answer(n - 1);
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  window.__gyakorlo = { get MG() { return MG; }, get WS() { return WS; }, HM_WORDS, HM_KEYS, GEN, TOPICS, makeQuestion, GR, GOF };
  init();
})();
</script>
</body>
</html>
